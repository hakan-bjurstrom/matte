ip"><b>${t}</b> ${e}</p>`,fl=t=>`<div class="formula">${t}</div>`,THEORY={likformighet:()=>`\n    <p>Två trianglar är <b>likformiga</b> om de har samma vinklar. Den ena är då en förstoring eller förminskning av den andra, och alla motsvarande sidor har samma förhållande. Förhållandet kallas <b>skalfaktor</b>.</p>\n    ${fl(m(`${fr("<i>a</i>′","<i>a</i>")} = ${fr("<i>b</i>′","<i>b</i>")} = ${fr("<i>c</i>′","<i>c</i>")} = <i>k</i>`))}\n    <h3>En parallell sida ger likformighet</h3>\n    <p>Om sträckan DE dras parallellt med sidan BC i triangeln ABC bildas en mindre triangel ADE. Den har samma vinklar som ABC och är därför likformig med den. Pilarna i figuren visar att DE och BC är parallella.</p>\n    <div class="fig">${likSVG({t:.5,labels:{AD:"3 cm",DB:"3 cm",DE:"4 cm",BC:"x"},unk:"BC"})}</div>\n    ${ex("Exempel",`<p>AD = 3 cm, DB = 3 cm och DE = 4 cm. Hur lång är BC?</p><p>Hela sidan AB = 3 + 3 = 6 cm. Sedan gäller ${m(`${fr("BC","DE")} = ${fr("AB","AD")}`)}, alltså ${m(`${fr(X,"4")} = ${fr("6","3")}`)}, vilket ger ${m(`${X} = 4 · 2 = 8`)} cm.</p>`)}\n    <h3>Skuggor</h3>\n    <p>Solstrålarna faller in med samma vinkel mot marken. Därför bildar ett föremål och dess skugga en triangel som är likformig med en annan persons eller saks triangel, uppmätt vid samma tidpunkt.</p>\n    ${tip("Vanligt misstag:","att jämföra DB med AD. Jämför alltid hela sidan i den stora triangeln med motsvarande sida i den lilla.")}`,trigsidor:()=>`\n    <p>I en rätvinklig triangel namnger vi sidorna utifrån den vinkel ${V} vi tittar på:</p>\n    <ul class="terms">\n      <li><b>Hypotenusan</b> ligger mittemot den räta vinkeln och är alltid längst.</li>\n      <li><b>Motstående katet</b> ligger mittemot vinkeln ${V}.</li>\n      <li><b>Närliggande katet</b> ligger intill vinkeln ${V} och är inte hypotenusan.</li>\n    </ul>\n    <div class="fig">${triSVG({angle:37,at:"A",vw:480,small:!0,labels:{AB:"hypotenusa",CB:"motstående katet",AC:"närliggande katet"},angleLabel:"v"})}</div>\n    <div class="formula-row">\n      ${fl(m(`sin ${V} = ${fr("motstående","hypotenusa")}`))}\n      ${fl(m(`cos ${V} = ${fr("närliggande","hypotenusa")}`))}\n      ${fl(m(`tan ${V} = ${fr("motstående","närliggande")}`))}\n    </div>\n    <div class="explorer" id="exp-trig">\n      <p class="eyebrow">Testa själv</p>\n      <label class="range-lbl" for="xt-v">Vinkel ${V}: <output id="xt-out">35°</output></label>\n      <input type="range" id="xt-v" min="15" max="75" value="35">\n      <div class="fig" id="xt-fig"></div>\n      <div class="ratios" id="xt-tbl"></div>\n      <p class="note">Hypotenusan är 10 cm. Förhållandena ändras bara när vinkeln ändras, inte när triangeln görs större eller mindre.</p>\n    </div>\n    ${ex("Exempel 1: sidan står i täljaren",`<p>${V} = 35°, närliggande katet 8 cm. Sök motstående katet ${X}.</p><p>${m(`tan 35° = ${fr(X,"8")}`)} ger ${m(`${X} = 8 · tan 35° ≈ 5,6`)} cm.</p>`)}\n    ${ex("Exempel 2: sidan står i nämnaren",`<p>${V} = 40°, motstående katet 6 cm. Sök hypotenusan ${X}.</p><p>${m(`sin 40° = ${fr("6",X)}`)}. Multiplicera med ${X} och dela med sin 40°: ${m(`${X} = ${fr("6","sin 40°")} ≈ 9,3`)} cm.</p>`)}\n    ${tip("Räknaren:","kontrollera att den står i grader (DEG), inte radianer (RAD). Annars blir alla svar fel.")}`,vinklar:()=>`\n    <p>Känner du två sidor kan du räkna ut vinkeln. Välj det förhållande som innehåller de två sidorna. Använd sedan den <b>inversa</b> funktionen på räknaren, ofta <kbd>SHIFT</kbd> eller <kbd>2nd</kbd> följt av <kbd>sin</kbd>, <kbd>cos</kbd> eller <kbd>tan</kbd>.</p>\n    <div class="formula-row">\n      ${fl(m(`tan ${V} = <i>a</i> &nbsp;⇒&nbsp; ${V} = ${inv("tan")}(<i>a</i>)`))}\n      ${fl(m(`sin ${V} = <i>a</i> &nbsp;⇒&nbsp; ${V} = ${inv("sin")}(<i>a</i>)`))}\n      ${fl(m(`cos ${V} = <i>a</i> &nbsp;⇒&nbsp; ${V} = ${inv("cos")}(<i>a</i>)`))}\n    </div>\n    <div class="fig">${triSVG({angle:32,at:"A",labels:{CB:"5 cm",AC:"8 cm"},angleLabel:"v"})}</div>\n    ${ex("Exempel",`<p>Motstående katet är 5 cm och närliggande katet är 8 cm.</p><p>${m(`tan ${V} = ${fr("5","8")} = 0,625`)} ger ${m(`${V} = ${inv("tan")}(0,625) ≈ 32,0°`)}.</p>`)}\n    ${tip("Rimlighetskontroll:","vinklarna i en triangel är tillsammans 180°, så den andra spetsiga vinkeln blir 90° − v. Är motstående katet kortare än närliggande ska v vara mindre än 45°.")}`,koordinat:()=>`\n    <p>Mellan två punkter A och B i ett koordinatsystem kan du alltid rita en rätvinklig triangel. Kateterna är skillnaderna i x-led och y-led:</p>\n    ${fl(m(`Δ${X} = <i>x</i><sub>B</sub> − <i>x</i><sub>A</sub> &nbsp;&nbsp; Δ<i>y</i> = <i>y</i><sub>B</sub> − <i>y</i><sub>A</sub>`))}\n    <div class="fig">${gridSVG({xmin:-1,xmax:7,ymin:-1,ymax:6,scale:30,items:[{t:"seg",x1:1,y1:1,x2:5,y2:1,cls:"seg-dash"},{t:"seg",x1:5,y1:1,x2:5,y2:4,cls:"seg-dash"},{t:"angle",v:[1,1],a:[5,1],b:[5,4],label:"v",r:28},{t:"seg",x1:1,y1:1,x2:5,y2:4},{t:"text",x:3,y:.55,text:"Δx = 4"},{t:"text",x:5.25,y:2.5,text:"Δy = 3",anchor:"start"},{t:"pt",x:1,y:1,label:"A(1, 1)",pos:"nw"},{t:"pt",x:5,y:4,label:"B(5, 4)",pos:"nw"}]})}</div>\n    <h3>Avstånd mellan två punkter</h3>\n    ${fl(m(`<i>d</i> = ${sqrt("(Δ<i>x</i>)² + (Δ<i>y</i>)²")}`))}\n    <h3>Vinkel mot x-axeln</h3>\n    <p>Sett från vinkeln vid A är Δy motstående katet och Δx närliggande katet. Det är samma sak som linjens k-värde.</p>\n    ${fl(m(`tan ${V} = ${fr("Δ<i>y</i>","Δ<i>x</i>")} = <i>k</i>`))}\n    ${ex("Exempel",`<p>A(1, 1) och B(5, 4) ger Δx = 4 och Δy = 3.</p><p>Avståndet: ${m(`<i>d</i> = ${sqrt("4² + 3²")} = ${sqrt("25")} = 5`)} l.e.</p><p>Vinkeln: ${m(`${V} = ${inv("tan")}(${fr("3","4")}) ≈ 36,9°`)}</p>`)}\n    ${tip("Tänk på:","Δx och Δy kan bli negativa, men när du kvadrerar blir de alltid positiva.")}`,trigtext:()=>`\n    <p>I textuppgifter är det figuren som avgör. Arbeta i den här ordningen:</p>\n    <ol class="steps-list">\n      <li>Rita en figur.</li>\n      <li>Markera den räta vinkeln, den kända vinkeln och sidorna du vet.</li>\n      <li>Bestäm vilken sida du söker och välj sin, cos eller tan.</li>\n      <li>Ställ upp en ekvation och lös den.</li>\n      <li>Gör en rimlighetskontroll och svara med enhet.</li>\n    </ol>\n    <div class="fig">${triSVG({angle:72,at:"A",labels:{AB:"4 m",CB:"x"},unk:"CB",angleLabel:"72°"})}</div>\n    ${ex("Exempel: stege",`<p>En 4 m lång stege bildar vinkeln 72° med marken. Hur högt når den?</p><p>Stegen är hypotenusan och höjden är motstående katet: ${m(`sin 72° = ${fr(X,"4")}`)} ger ${m(`${X} = 4 · sin 72° ≈ 3,8`)} m.</p><p>Rimligt, eftersom höjden ska vara kortare än stegen.</p>`)}\n    <h3>Ord som brukar dyka upp</h3>\n    <ul class="terms">\n      <li><b>Lutningsvinkel:</b> vinkeln mellan en backe, ramp eller stege och marken.</li>\n      <li><b>Höjdvinkel:</b> vinkeln uppåt från vågrätt till det du tittar på.</li>\n      <li><b>Vågrät och lodrät:</b> horisontell och vertikal. De bildar alltid en rät vinkel.</li>\n    </ul>`,skalar:()=>`\n    <p>En <b>skalär</b> beskrivs med bara ett tal och en enhet, till exempel massa, tid, temperatur, fart och sträcka.</p>\n    <p>En <b>vektor</b> har både <b>storlek och riktning</b>, till exempel förflyttning, hastighet och kraft. En vektor ritas som en pil. Längden visar storleken och pilen visar riktningen.</p>\n    <div class="tbl-wrap"><table class="cmp"><thead><tr><th>Skalär</th><th>Vektor</th></tr></thead><tbody>\n      <tr><td>Farten 50 km/h</td><td>Hastigheten 50 km/h norrut</td></tr>\n      <tr><td>Sträckan 3 km</td><td>Förflyttningen 3 km österut</td></tr>\n      <tr><td>Massan 2 kg</td><td>Kraften 20 N nedåt</td></tr>\n    </tbody></table></div>\n    <div class="fig">${gridSVG({xmin:-6,xmax:6,ymin:-3,ymax:4,scale:26,axes:!1,items:[{t:"arrow",x1:-5,y1:-1,x2:-2,y2:1,cls:"u",label:"u"},{t:"arrow",x1:-1,y1:1,x2:2,y2:3,cls:"u",label:"u"},{t:"arrow",x1:5,y1:1,x2:2,y2:-1,cls:"v",label:"−u",side:-1}]})}</div>\n    <p class="caption">De två blå pilarna är samma vektor ${vec("u")}: lika långa och med samma riktning, fast de är ritade på olika ställen. Den orange pilen är ${vec("−u")}, lika lång men med motsatt riktning.</p>\n    <h3>Beteckningar</h3>\n    <ul class="terms">\n      <li>${vec("u")} eller ${vec("AB")} betecknar en vektor. ${vec("AB")} går från punkten A till punkten B.</li>\n      <li>${m(`|${vec("u")}|`)} är vektorns längd, även kallad belopp.</li>\n    </ul>`,vekgrafisk:()=>`\n    <h3>Addition</h3>\n    <p>Lägg ${vec("v")} så att dess fot hamnar vid spetsen av ${vec("u")}. Summan ${m(`${vec("u")} + ${vec("v")}`)} går från foten av ${vec("u")} till spetsen av ${vec("v")}.</p>\n    <h3>Subtraktion</h3>\n    <p>${m(`${vec("u")} − ${vec("v")} = ${vec("u")} + (−${vec("v")})`)}. Vänd på ${vec("v")} och addera.</p>\n    <h3>Multiplikation med ett tal</h3>\n    <p>${m(`2${vec("u")}`)} är dubbelt så lång som ${vec("u")} och har samma riktning. Ett negativt tal vänder riktningen.</p>\n    <div class="explorer" id="exp-vec">\n      <p class="eyebrow">Testa själv</p>\n      <div class="vec-ctrl">\n        <span class="m">${vec("u")} = (</span><input class="inp sm" id="xu-x" type="number" min="-5" max="5" value="3" aria-label="u x-koordinat"><span class="m">,</span><input class="inp sm" id="xu-y" type="number" min="-5" max="5" value="1" aria-label="u y-koordinat"><span class="m">)</span>\n        <span class="m gap">${vec("v")} = (</span><input class="inp sm" id="xv-x" type="number" min="-5" max="5" value="1" aria-label="v x-koordinat"><span class="m">,</span><input class="inp sm" id="xv-y" type="number" min="-5" max="5" value="3" aria-label="v y-koordinat"><span class="m">)</span>\n      </div>\n      <div class="segctl" role="group" aria-label="Räknesätt">\n        <button type="button" data-op="add" aria-pressed="true">${vec("u")} + ${vec("v")}</button>\n        <button type="button" data-op="sub" aria-pressed="false">${vec("u")} − ${vec("v")}</button>\n        <button type="button" data-op="mul" aria-pressed="false">2${vec("u")}</button>\n      </div>\n      <div class="fig" id="xv-fig"></div>\n      <p class="note" id="xv-txt"></p>\n    </div>\n    ${tip("Ordningen:",`vid addition spelar ordningen ingen roll, ${m(`${vec("u")} + ${vec("v")} = ${vec("v")} + ${vec("u")}`)}. Vid subtraktion gör den det: ${m(`${vec("v")} − ${vec("u")}`)} pekar åt motsatt håll mot ${m(`${vec("u")} − ${vec("v")}`)}.`)}`,vekkoord:()=>`\n    <p>${m(`${vec("u")} = (3, −2)`)} betyder 3 steg åt höger i x-led och 2 steg nedåt i y-led. Talen kallas vektorns <b>koordinater</b> eller komponenter.</p>\n    <div class="fig">${gridSVG({xmin:-1,xmax:5,ymin:-3,ymax:2,scale:32,items:[{t:"arrow",x1:0,y1:0,x2:3,y2:-2,cls:"u",label:"u",side:-1}]})}</div>\n    <h3>Räkna komponentvis</h3>\n    <div class="formula-row">\n      ${fl(m("(<i>a</i>, <i>b</i>) + (<i>c</i>, <i>d</i>) = (<i>a</i> + <i>c</i>, <i>b</i> + <i>d</i>)"))}\n      ${fl(m("(<i>a</i>, <i>b</i>) − (<i>c</i>, <i>d</i>) = (<i>a</i> − <i>c</i>, <i>b</i> − <i>d</i>)"))}\n      ${fl(m("<i>k</i> · (<i>a</i>, <i>b</i>) = (<i>ka</i>, <i>kb</i>)"))}\n    </div>\n    <h3>Vektor mellan två punkter</h3>\n    ${fl(m(`${vec("AB")} = (<i>x</i><sub>B</sub> − <i>x</i><sub>A</sub>, <i>y</i><sub>B</sub> − <i>y</i><sub>A</sub>)`))}\n    <p>Kom ihåg det som <b>spets minus fot</b>.</p>\n    ${ex("Exempel 1",`<p>${m(`${vec("u")} = (3, −2)`)} och ${m(`${vec("v")} = (−1, 4)`)}.</p><p>${m(`2${vec("u")} − ${vec("v")} = (6, −4) − (−1, 4) = (6 + 1, −4 − 4) = (7, −8)`)}</p>`)}\n    ${ex("Exempel 2",`<p>A(2, 1) och B(−3, 4).</p><p>${m(`${vec("AB")} = (−3 − 2, 4 − 1) = (−5, 3)`)}</p>`)}\n    ${tip("Tecknen:","minus ett negativt tal blir plus, till exempel 6 − (−1) = 7.")}`,veklangd:()=>`\n    <p>Längden av en vektor, även kallad <b>beloppet</b>, räknas med Pythagoras sats. Koordinaterna är kateterna i en rätvinklig triangel.</p>\n    ${fl(m(`|${vec("u")}| = ${sqrt("<i>x</i>² + <i>y</i>²")}`)+" &nbsp; om "+m(`${vec("u")} = (<i>x</i>, <i>y</i>)`))}\n    <div class="fig">${gridSVG({xmin:-4,xmax:1,ymin:-1,ymax:5,scale:32,items:[{t:"seg",x1:0,y1:0,x2:-3,y2:0,cls:"seg-dash"},{t:"seg",x1:-3,y1:0,x2:-3,y2:4,cls:"seg-dash"},{t:"arrow",x1:0,y1:0,x2:-3,y2:4,cls:"u",label:"u"}]})}</div>\n    ${ex("Exempel 1",`<p>${m(`${vec("u")} = (−3, 4)`)}</p><p>${m(`|${vec("u")}| = ${sqrt("(−3)² + 4²")} = ${sqrt("9 + 16")} = ${sqrt("25")} = 5`)}</p>`)}\n    ${ex("Exempel 2",`<p>${m(`${vec("u")} = (2, −5)`)}</p><p>${m(`|${vec("u")}| = ${sqrt("2² + (−5)²")} = ${sqrt("29")} ≈ 5,4`)}</p>`)}\n    <p>Längden av ${vec("AB")} är samma sak som avståndet mellan punkterna A och B.</p>\n    ${tip("Räknaren:","skriv parentes runt negativa tal, (−3)². Utan parentes räknar många räknare −3² = −9.")}`};Object.assign(THEORY,{koordprop:()=>`\n    <p>Ett koordinatsystem har en vågrät <b>x-axel</b> och en lodrät <b>y-axel</b>. De möts i <b>origo</b>, punkten (0, 0). En punkt beskrivs med två koordinater (x, y): först hur långt åt sidan, sedan hur långt upp eller ner.</p>\n    <div class="fig">${g4([{t:"text",x:3,y:4.2,text:"Första",cls:"q-lbl"},{t:"text",x:-3,y:4.2,text:"Andra",cls:"q-lbl"},{t:"text",x:-3,y:-4.2,text:"Tredje",cls:"q-lbl"},{t:"text",x:3,y:-4.2,text:"Fjärde",cls:"q-lbl"},{t:"pt",x:3,y:2,label:"P(3, 2)",pos:"ne"},{t:"pt",x:-4,y:-1,label:"Q(−4, −1)",pos:"nw"}],{xmin:-6,xmax:6,ymin:-5,ymax:5})}</div>\n    <p>Axlarna delar planet i fyra <b>kvadranter</b>. De numreras moturs, med start uppe till höger där både x och y är positiva.</p>\n    <h3>Proportionalitet</h3>\n    <p>Två storheter är <b>proportionella</b> om den ena är ett tal gånger den andra. Kvoten y/x är då alltid densamma, och grafen är en rät linje genom origo. Talet k kallas proportionalitetskonstant.</p>\n    <div class="formula-row">${fl(m("<i>y</i> = <i>kx</i>"))}${fl(m(`<i>k</i> = ${fr("<i>y</i>","<i>x</i>")}`))}</div>\n    ${ex("Exempel",`<p>3 kg äpplen kostar 66 kr, och priset är proportionellt mot vikten. Vad kostar 5 kg?</p><p>${m(`<i>k</i> = ${fr("66","3")} = 22`)} kr per kg, så 5 kg kostar ${m("22 · 5 = 110")} kr.</p>`)}\n    ${tip("Vanligt misstag:","att tro att skillnaden mellan y och x är konstant. Vid proportionalitet är det kvoten som är konstant.")}`,linmodell:()=>`\n    <p>Ett <b>linjärt samband</b> skrivs ${m("<i>y</i> = <i>kx</i> + <i>m</i>")}. Grafen är en rät linje.</p>\n    <ul class="terms">\n      <li><b>m</b> är startvärdet, alltså y när x = 0. Där skär linjen y-axeln.</li>\n      <li><b>k</b> är hur mycket y ändras när x ökar med 1. Positivt k betyder att y ökar, negativt k att y minskar.</li>\n    </ul>\n    <div class="fig">${g4([{t:"line",k:-2,m:10,from:0,to:5},{t:"pt",x:0,y:10,label:"start 10 cm",pos:"ne"},{t:"pt",x:5,y:0,label:"slut efter 5 h",pos:"ne"}],{xmin:-1,xmax:8,ymin:-1,ymax:11,scale:22})}</div>\n    ${ex("Exempel: ljus",`<p>Ett ljus är 10 cm långt och brinner ner 2 cm per timme. Längden efter x timmar är ${lineH(-2,10)}.</p><p>Efter 3 timmar: ${m("<i>y</i> = −2 · 3 + 10 = 4")} cm.</p><p>När är ljuset slut? ${m("0 = −2<i>x</i> + 10")} ger ${m("<i>x</i> = 5")} timmar.</p>`)}\n    ${tip("Läs texten efter två saker:","vad startvärdet är (m), och hur mycket det ändras per enhet (k).")}`,ekvgraf:()=>`\n    <p>En rät linje kan skrivas på <b>k-form</b>: ${m("<i>y</i> = <i>kx</i> + <i>m</i>")}.</p>\n    <ul class="terms">\n      <li><b>k-värdet</b> (lutningen) säger hur många steg y ändras när x ökar med 1.</li>\n      <li><b>m-värdet</b> är y-koordinaten där linjen skär y-axeln.</li>\n    </ul>\n    <div class="fig">${g4([{t:"seg",x1:1,y1:1,x2:2,y2:1,cls:"seg-dash"},{t:"seg",x1:2,y1:1,x2:2,y2:3,cls:"seg-dash"},{t:"line",k:2,m:-1},{t:"text",x:1.5,y:.5,text:"1"},{t:"text",x:2.4,y:2,text:"2"},{t:"pt",x:0,y:-1,label:"m = −1",pos:"se"}])}</div>\n    <p class="caption">Linjen ${lineH(2,-1)}: ett steg åt höger ger två steg upp, och linjen skär y-axeln i −1.</p>\n    <h3>Rita linjen från ekvationen</h3>\n    <ol class="steps-list"><li>Pricka in m på y-axeln.</li><li>Gå 1 steg åt höger och k steg upp, eller ner om k är negativt.</li><li>Dra linjen genom punkterna.</li></ol>\n    <div class="explorer" id="exp-line">\n      <p class="eyebrow">Testa själv</p>\n      <label class="range-lbl" for="xl-k">k = <output id="xl-ko">1</output></label>\n      <input type="range" id="xl-k" min="-3" max="3" step="0.5" value="1">\n      <label class="range-lbl" for="xl-m">m = <output id="xl-mo">2</output></label>\n      <input type="range" id="xl-m" min="-5" max="5" step="1" value="2">\n      <div class="fig" id="xl-fig"></div>\n      <p class="note" id="xl-txt"></p>\n    </div>\n    <h3>Allmän form</h3>\n    <p>Ibland skrivs linjen som ${m("<i>ax</i> + <i>by</i> + <i>c</i> = 0")}. Lös ut y för att få k-form.</p>\n    ${ex("Exempel",`<p>${m("2<i>x</i> + <i>y</i> − 4 = 0")} ger ${lineH(-2,4)}, alltså k = −2 och m = 4.</p>`)}\n    <h3>Ligger punkten på linjen?</h3>\n    <p>Sätt in punktens x-värde i ekvationen. Får du punktens y-värde ligger punkten på linjen. Punkten (3, 5) ligger på ${lineH(2,-1)} eftersom ${m("2 · 3 − 1 = 5")}.</p>`,grafekv:()=>`\n    <p>Om du känner två punkter på linjen kan du räkna ut k-värdet:</p>\n    ${fl(m(`<i>k</i> = ${fr("Δ<i>y</i>","Δ<i>x</i>")} = ${fr("<i>y</i><sub>2</sub> − <i>y</i><sub>1</sub>","<i>x</i><sub>2</sub> − <i>x</i><sub>1</sub>")}`))}\n    <div class="fig">${g4([{t:"seg",x1:-1,y1:1,x2:3,y2:1,cls:"seg-dash"},{t:"seg",x1:3,y1:1,x2:3,y2:3,cls:"seg-dash"},{t:"line",k:.5,m:1.5},{t:"text",x:1,y:.5,text:"Δx = 4"},{t:"text",x:3.3,y:2,text:"Δy = 2",anchor:"start"},{t:"pt",x:-1,y:1,label:"(−1, 1)",pos:"nw"},{t:"pt",x:3,y:3,label:"(3, 3)",pos:"nw"}])}</div>\n    ${ex("Exempel",`<p>Linjen går genom (−1, 1) och (3, 3).</p><p>${m(`<i>k</i> = ${fr("3 − 1","3 − (−1)")} = ${fr("2","4")} = ${fr("1","2")}`)}</p><p>Sätt in (3, 3) i ${m("<i>y</i> = <i>kx</i> + <i>m</i>")}: ${m(`3 = ${fr("1","2")} · 3 + <i>m</i>`)} ger ${m("<i>m</i> = 1,5")}.</p><p>Svar: ${lineH(F(1,2),1.5)}</p>`)}\n    <h3>Läsa av en graf</h3>\n    <p>Läs av m där linjen skär y-axeln. Leta sedan upp en punkt där linjen går genom ett hörn i rutnätet och räkna steg: k = steg upp (eller ner) delat med steg åt höger.</p>\n    <h3>Enpunktsform</h3>\n    ${fl(m("<i>y</i> − <i>y</i><sub>1</sub> = <i>k</i>(<i>x</i> − <i>x</i><sub>1</sub>)"))}\n    <p>Den passar när du vet k och en punkt. Förenkla sedan till k-form.</p>\n    ${ex("Exempel",`<p>k = 3 och punkten (2, 5): ${m("<i>y</i> − 5 = 3(<i>x</i> − 2)")}, alltså ${m("<i>y</i> = 3<i>x</i> − 6 + 5")} = ${lineH(3,-1)}.</p>`)}\n    ${tip("Tänk på:","ta punkterna i samma ordning i täljaren och nämnaren. Annars får k fel tecken.")}`,parvink:()=>`\n    <p><b>Parallella</b> linjer lutar lika mycket. De har samma k-värde men olika m-värde.</p>\n    ${fl(m("<i>k</i><sub>1</sub> = <i>k</i><sub>2</sub>"))}\n    <p><b>Vinkelräta</b> linjer skär varandra i rät vinkel. Produkten av deras k-värden är −1.</p>\n    ${fl(m("<i>k</i><sub>1</sub> · <i>k</i><sub>2</sub> = −1"))}\n    <div class="fig">${g4([{t:"line",k:2,m:1,label:"A"},{t:"line",k:2,m:-3,label:"B"},{t:"line",k:-.5,m:1,cls:"line-alt",label:"C",alt:!0}])}</div>\n    <p class="caption">A: ${lineH(2,1)} och B: ${lineH(2,-3)} är parallella. C: ${lineH(F(-1,2),1)} är vinkelrät mot båda, eftersom ${m(`2 · (−${fr("1","2")}) = −1`)}.</p>\n    ${ex("Exempel",`<p>Bestäm linjen som är vinkelrät mot ${lineH(2,1)} och går genom (2, 3).</p><p>${m(`<i>k</i> = −${fr("1","2")}`)}. Sätt in punkten: ${m(`3 = −${fr("1","2")} · 2 + <i>m</i>`)} ger m = 4.</p><p>Svar: ${lineH(F(-1,2),4)}</p>`)}\n    ${tip("Snabbregel:","för en vinkelrät linje vänder du på k-värdet och byter tecken. 2/3 blir −3/2, och 4 blir −1/4.")}`,funktion:()=>`\n    <p>En <b>funktion</b> är en regel som ger exakt ett y-värde för varje x-värde. Vi skriver ${m(fxH())} och läser det som "f av x".</p>\n    <p><b>Funktionsvärdet</b> ${m("<i>f</i>(3)")} får du genom att sätta in x = 3 i funktionen. Det är samma sak som grafens y-värde när x = 3.</p>\n    ${ex("Exempel",`<p>${m(`${fxH()} = 2<i>x</i>² − 3<i>x</i>`)}</p><p>${m("<i>f</i>(−2) = 2 · (−2)² − 3 · (−2) = 8 + 6 = 14")}</p>`)}\n    <h3>Två sorters frågor</h3>\n    <ul class="terms">\n      <li>${m("<i>f</i>(4) = ?")} Sätt in x = 4 och räkna ut y.</li>\n      <li>${m(`${fxH()} = 4`)}? Leta upp vilket x som ger y = 4. Det är en ekvation.</li>\n    </ul>\n    <h3>Grafisk ekvationslösning</h3>\n    <p>Ekvationen ${m(`${fxH("f")} = ${fxH("g")}`)} kan du lösa genom att rita båda graferna. Lösningen är x-koordinaten i skärningspunkten. I en grafritande räknare, Desmos eller GeoGebra finns ett verktyg för skärningspunkter.</p>\n    <div class="fig">${g4([{t:"line",k:.5,m:1,label:"f"},{t:"line",k:-1,m:4,cls:"line-alt",label:"g",alt:!0},{t:"pt",x:2,y:2,label:"(2, 2)",pos:"ne"}])}</div>\n    <p class="caption">${m(`${fxH("f")} = 0,5<i>x</i> + 1`)} och ${m(`${fxH("g")} = −<i>x</i> + 4`)} skär varandra i (2, 2). Lösningen är x = 2.</p>\n    ${tip("Kom ihåg:","f(2) = 5 betyder att punkten (2, 5) ligger på grafen.")}`,defvarde:()=>`\n    <p><b>Definitionsmängden</b> är alla x-värden som funktionen gäller för. <b>Värdemängden</b> är alla y-värden som funktionen antar.</p>\n    <div class="fig">${g4([{t:"line",k:-1,m:4,from:-1,to:3},{t:"pt",x:-1,y:5,label:"(−1, 5)",pos:"ne"},{t:"pt",x:3,y:1,label:"(3, 1)",pos:"ne"}])}</div>\n    <p class="caption">Grafen finns från x = −1 till x = 3. Definitionsmängd: ${m("−1 ≤ <i>x</i> ≤ 3")}. Värdemängd: ${m("1 ≤ <i>y</i> ≤ 5")}.</p>\n    <h3>Räkna ut värdemängden</h3>\n    <p>För en linjär funktion antas det minsta och största värdet i ändpunkterna. Räkna ut funktionsvärdet där och skriv det minsta först.</p>\n    ${ex("Exempel",`<p>${m(`${fxH()} = 3<i>x</i> − 2`)} med ${m("1 ≤ <i>x</i> ≤ 5")}.</p><p>${m("<i>f</i>(1) = 1")} och ${m("<i>f</i>(5) = 13")}, så värdemängden är ${m("1 ≤ <i>y</i> ≤ 13")}.</p>`)}\n    <h3>I verkligheten</h3>\n    <p>I en modell sätter situationen gränserna. Tiden kan inte vara negativ, och ett ljus kan inte bli kortare än 0 cm.</p>\n    ${tip("Minnesregel:","definitionsmängden hör ihop med x och värdemängden med y.")}`,expfunk:()=>`\n    <p>När något ökar eller minskar med <b>samma procent</b> varje gång beskrivs det av en <b>exponentialfunktion</b>:</p>\n    ${fl(m(`${fxH()} = <i>C</i> · <i>a</i><sup><i>x</i></sup>`))}\n    <ul class="terms">\n      <li><b>C</b> är startvärdet, alltså värdet när x = 0.</li>\n      <li><b>a</b> är förändringsfaktorn. Om a &gt; 1 ökar värdet, om 0 &lt; a &lt; 1 minskar det.</li>\n    </ul>\n    <h3>Förändringsfaktor</h3>\n    <p>En ökning med 6 % ger a = 1,06. En minskning med 15 % ger a = 0,85, eftersom 85 % finns kvar.</p>\n    <div class="explorer" id="exp-exp">\n      <p class="eyebrow">Testa själv</p>\n      <label class="range-lbl" for="xe-a">a = <output id="xe-ao">1,2</output></label>\n      <input type="range" id="xe-a" min="0.5" max="1.5" step="0.05" value="1.2">\n      <div class="fig" id="xe-fig"></div>\n      <p class="note" id="xe-txt"></p>\n    </div>\n    ${ex("Exempel",`<p>En bil kostar 250 000 kr och värdet minskar med 12 % per år.</p><p>${m("<i>V</i>(<i>x</i>) = 250 000 · 0,88<sup><i>x</i></sup>")}</p><p>Efter 5 år: ${m("250 000 · 0,88<sup>5</sup> ≈ 131 933")} kr.</p>`)}\n    <h3>Linjär eller exponentiell?</h3>\n    <p>Ändras något med lika många enheter varje gång är det linjärt. Ändras det med lika många procent är det exponentiellt.</p>\n    ${tip("Vanligt misstag:","att räkna 250 000 · 0,88 · 5. Exponenten betyder att du multiplicerar med 0,88 fem gånger.")}`,potfunk:()=>`\n    <p>En <b>potensfunktion</b> har formen</p>\n    ${fl(m(`${fxH()} = <i>C</i> · <i>x</i><sup><i>a</i></sup>`))}\n    <p>Här står x i <b>basen</b>. I en exponentialfunktion står x i exponenten.</p>\n    <div class="fig">${g4([{t:"fn",f:t=>t*t,label:"f",lx:1.6},{t:"fn",f:t=>4/t,from:.45,to:6,alt:!0,label:"g",lx:3.2}],{xmin:-4,xmax:6,ymin:-2,ymax:9,scale:24})}</div>\n    <p class="caption">${m(`${fxH("f")} = <i>x</i>²`)} och ${m(`${fxH("g")} = ${fr("4","<i>x</i>")}`)} (för x &gt; 0) är båda potensfunktioner.</p>\n    <div class="tbl-wrap"><table class="cmp"><thead><tr><th>Funktion</th><th>Exponent</th></tr></thead><tbody>\n      <tr><td>${m(`${fxH()} = 3<i>x</i>²`)}</t >C</i> · <i>x</i><sup><i>a</i></sup>`))}\n      </tbody></table>\n    </section>\n  </div>\n  <section class="card">\n    <h2>Vanliga misstag</h2>\n    <ul class="mistakes">\n      <li><b>k och m byter plats.</b> k står framför x, m står ensamt.</li>\n      <li><b>Δx delat med Δy.</b> k är Δy delat med Δx, alltså upp delat med åt sidan.</li>\n      <li><b>Olika ordning i täljare och nämnare.</b> Ta punkterna i samma ordning, annars får k fel tecken.</li>\n      <li><b>f(5) och f(x) = 5 blandas ihop.</b> Det första är ett y-värde, det andra en ekvation där du söker x.</li>\n      <li><b>Värdemängden i fel ordning.</b> Skriv alltid det minsta värdet först.</li>\n      <li><b>Förändringsfaktorn 0,06 i stället för 1,06.</b> Faktorn är hela det nya värdet, 100 % + 6 %.</li>\n      <li><b>C · a · x i stället för C · aˣ.</b> Exponenten betyder att du multiplicerar med a flera gånger.</li>\n      <li><b>Negativa tal i kvadrat.</b> (−3)² = 9. Använd parentes på räknaren.</li>\n    </ul>\n  </section>`}function formler6(){return`\n  <div class="ov-grid">\n    <section class="card">\n      <h2>6.1 Trigonometri</h2>\n      <div class="fig sm">${triSVG({angle:37,at:"A",vw:480,small:!0,labels:{AB:"hypotenusa",CB:"motstående katet",AC:"närliggande katet"},angleLabel:"v"})}</div>\n      <table class="ftable"><tbody>\n        ${frow("Sinus",m(`sin ${V} = ${fr("motstående","hypotenusa")}`))}\n        ${frow("Cosinus",m(`cos ${V} = ${fr("närliggande","hypotenusa")}`))}\n        ${frow("Tangens",m(`tan ${V} = ${fr("motstående","närliggande")}`))}\n        ${frow("Vinkel",m(`${V} = ${inv("tan")}(…)`)+", och likadant med sin och cos")}\n        ${frow("Pythagoras",m("<i>a</i>² + <i>b</i>² = <i>c</i>²"))}\n        ${frow("Likformighet","Samma vinklar. Motsvarande sidor har samma förhållande.")}\n        ${frow("Avstånd",m(`<i>d</i> = ${sqrt("(Δ<i>x</i>)² + (Δ<i>y</i>)²")}`))}\n        ${frow("Vinkel mot x-axeln",m(`tan ${V} = ${fr("Δ<i>y</i>","Δ<i>x</i>")} = <i>k</i>`))}\n      </tbody></table>\n    </section>\n    <section class="card">\n      <h2>6.2 Vektorer</h2>\n      <table class="ftable"><tbody>\n        ${frow("Vektor","Har storlek och riktning, till exempel kraft och hastighet.")}\n        ${frow("Skalär","Har bara storlek, till exempel massa, tid och fart.")}\n        ${frow("Addition",m("(<i>a</i>, <i>b</i>) + (<i>c</i>, <i>d</i>) = (<i>a</i> + <i>c</i>, <i>b</i> + <i>d</i>)"))}\n        ${frow("Subtraktion",m("(<i>a</i>, <i>b</i>) − (<i>c</i>, <i>d</i>) = (<i>a</i> − <i>c</i>, <i>b</i> − <i>d</i>)"))}\n        ${frow("Multiplikation",m("<i>k</i>(<i>a</i>, <i>b</i>) = (<i>ka</i>, <i>kb</i>)"))}\n        ${frow("Mellan punkter",m(`${vec("AB")} = (<i>x</i><sub>B</sub> − <i>x</i><sub>A</sub>, <i>y</i><sub>B</sub> − <i>y</i><sub>A</sub>)`))}\n        ${frow("Längd",m(`|${vec("u")}| = ${sqrt("<i>x</i>² + <i>y</i>²")}`))}\n        ${frow("Grafiskt",`Addition: fot mot spets. Subtraktion: ${m(`${vec("u")} + (−${vec("v")})`)}.`)}\n      </tbody></table>\n    </section>\n  </div>\n  <section class="card">\n    <h2>Vanliga misstag</h2>\n    <ul class="mistakes">\n      <li><b>Räknaren står i RAD.</b> Ställ den i DEG (grader) innan provet.</li>\n      <li><b>Fel katet.</b> Motstående och närliggande beror på vilken vinkel du utgår från.</li>\n      <li><b>Multiplicera eller dividera.</b> Står x i nämnaren ska du dividera: ${m(`sin 40° = ${fr("6",X)}`)} ger ${m(`${X} = ${fr("6","sin 40°")}`)}.</li>\n      <li><b>Delen i stället för hela sidan.</b> Vid likformighet: AB = AD + DB.</li>\n      <li><b>Fot minus spets.</b> ${vec("AB")} är B minus A, inte A minus B.</li>\n      <li><b>Negativa tal i kvadrat.</b> (−3)² = 9. Använd parentes på räknaren.</li>\n      <li><b>Glömd enhet.</b> Svara med cm, m, grader eller l.e.</li>\n    </ul>\n  </section>`}function renderFormler(){const t=curCh();view.innerHTML=`<section class="hero"><p class="eyebrow">Kapitel ${t.num} · ${t.title}</p><h1>Formelblad</h1><p class="lede">Allt du behöver kunna utantill, plus de misstag som är lättast att göra.</p></section>`+("k4"===t.id?formler4():formler6())}load(),route.ch=store.lastCh,render();</script>
