kast. Varje kast är oberoende, så sannolikheten är fortfarande 1/6."],[`Mindre än ${k(u(1,6))}, eftersom tärningen verkar ge få sexor`,`Att inte få någon sexa på ${e} kast händer ganska ofta med en vanlig tärning. Det räcker inte för att säga att tärningen är falsk.`]]);return{kind:"mc",optClass:"txt long",prompt:`En vanlig tärning har inte visat någon sexa på de senaste ${e} kasten. Hur stor är sannolikheten att nästa kast blir en sexa?`,figure:"",options:t.map((e=>e[0])),correct:t.findIndex((e=>null===e[1])),mcMsg:t.map((e=>e[1])),hints:["Kan tärningen komma ihåg vad den visade tidigare?","Kasten är oberoende av varandra. Sannolikheten är densamma varje gång."],solution:["Tärningen minns inte tidigare kast. Kasten är oberoende.",`Sannolikheten för en sexa är därför ${k(u(1,6))} även i nästa kast.`],answerText:k(u(1,6))}}const t=l(["Ali","Bea","Cem","Dana","Elin","Femi"]).slice(0,4),a=s([400,500,1e3]),i=l([10,20,50,a]),d=s([.35,.4,.6,.65]),m=i.map((e=>Math.min(e-1,Math.max(1,Math.round(e*(d+o(-.1,.1,.05))))))),$=i.indexOf(a);return{kind:"mc",optClass:"txt",prompt:"Fyra elever kastar var sitt likadant häftstift för att skatta sannolikheten att det landar med spetsen uppåt. Vems skattning är mest pålitlig?",figure:"",options:t.map(((e,t)=>`${e}: ${m[t]} av ${Te(i[t])} kast`)),correct:$,mcMsg:t.map(((e,t)=>t===$?null:`${e} gjorde bara ${i[t]} kast. Ju fler försök, desto pålitligare blir den relativa frekvensen som skattning.`)),hints:["Vad händer med den relativa frekvensen när antalet försök ökar?","Ju fler försök, desto närmare den verkliga sannolikheten hamnar den relativa frekvensen."],solution:[`${t[$]} gjorde flest kast, ${Te(a)} stycken.`,"Med många försök påverkar slumpen den relativa frekvensen mindre. Därför är den skattningen mest pålitlig."],answerText:`${t[$]}: ${m[$]} av ${Te(a)} kast`}}],examGens:[ms,$s],npA:[$s],npC:[ms]},{ch:"k5",id:"k5produkt",sec:"5.3",part:"Slumpförsök i flera steg",title:"Produktregeln",gens:[ps,ks,gs],examGens:[ps,ks],npA:[ps,gs],npC:[ks]},{ch:"k5",id:"k5trad",sec:"5.3",part:"Slumpförsök i flera steg",title:"Träddiagram",gens:[bs,bs,xs,ys],examGens:[bs,xs,ys],npA:[bs],npC:[ys,xs]},{ch:"k5",id:"k5komplement",sec:"5.3",part:"Slumpförsök i flera steg",title:"Komplementhändelse",gens:[Ms,ws,ws,Ds],examGens:[ws,Ms],npA:[Ms,Ds],npC:[ws]}];ve.k5={title:"Statistik och sannolikhet",parts:[["5.1","Statistiska undersökningar"],["5.2","Enkla slumpförsök"],["5.3","Slumpförsök i flera steg"]],extra:()=>xs(),extraMoment:"k5trad",extraAt:7,tips:[["Försök själv först.","Ett moment blir grönt när du klarar tre av de fyra senaste uppgifterna utan hjälp."],["Ta en ledtråd i taget.","Ofta räcker den första för att komma vidare."],["Rita ett träddiagram.","När försöket har flera steg: multiplicera längs grenarna och addera mellan grenarna."],["Kontrollera svaret.","En sannolikhet ligger alltid mellan 0 och 1. Får du mer än 1 har något blivit fel."]],checklist:["Penna och papper","Miniräknare","Ungefär 30 minuter"]};const Ts=(e,t)=>`<div class="example"><p class="eyebrow">${e}</p>${t}</div>`,Bs=(e,t)=>`<p class="tip"><b>${e}</b> ${t}</p>`,Es=e=>`<div class="formula">${e}</div>`,Ss={likformighet:()=>`\n    <p>Två trianglar är <b>likformiga</b> om de har samma vinklar. Den ena är då en förstoring eller förminskning av den andra, och alla motsvarande sidor har samma förhållande. Förhållandet kallas <b>skalfaktor</b>.</p>\n    ${Es(k(`${u("<i>a</i>′","<i>a</i>")} = ${u("<i>b</i>′","<i>b</i>")} = ${u("<i>c</i>′","<i>c</i>")} = <i>k</i>`))}\n    <h3>En parallell sida ger likformighet</h3>\n    <p>Om sträckan DE dras parallellt med sidan BC i triangeln ABC bildas en mindre triangel ADE. Den har samma vinklar som ABC och är därför likformig med den. Pilarna i figuren visar att DE och BC är parallella.</p>\n    <div class="fig">${F({t:.5,labels:{AD:"3 cm",DB:"3 cm",DE:"4 cm",BC:"x"},unk:"BC"})}</div>\n    ${Ts("Exempel",`<p>AD = 3 cm, DB = 3 cm och DE = 4 cm. Hur lång är BC?</p><p>Hela sidan AB = 3 + 3 = 6 cm. Sedan gäller ${k(`${u("BC","DE")} = ${u("AB","AD")}`)}, alltså ${k(`${u(v,"4")} = ${u("6","3")}`)}, vilket ger ${k(`${v} = 4 · 2 = 8`)} cm.</p>`)}\n    <h3>Skuggor</h3>\n    <p>Solstrålarna faller in med samma vinkel mot marken. Därför bildar ett föremål och dess skugga en triangel som är likformig med en annan persons eller saks triangel, uppmätt vid samma tidpunkt.</p>\n    ${Bs("Vanligt misstag:","att jämföra DB med AD. Jämför alltid hela sidan i den stora triangeln med motsvarande sida i den lilla.")}`,trigsidor:()=>`\n    <p>I en rätvinklig triangel namnger vi sidorna utifrån den vinkel ${h} vi tittar på:</p>\n    <ul class="terms">\n      <li><b>Hypotenusan</b> ligger mittemot den räta vinkeln och är alltid längst.</li>\n      <li><b>Motstående katet</b> ligger mittemot vinkeln ${h}.</li>\n      <li><b>Närliggande katet</b> ligger intill vinkeln ${h} och är inte hypotenusan.</li>\n    </ul>\n    <div class="fig">${P({angle:37,at:"A",vw:480,small:!0,labels:{AB:"hypotenusa",CB:"motstående katet",AC:"närliggande katet"},angleLabel:"v"})}</div>\n    <div class="formula-row">\n      ${Es(k(`sin ${h} = ${u("motstående","hypotenusa")}`))}\n      ${Es(k(`cos ${h} = ${u("närliggande","hypotenusa")}`))}\n      ${Es(k(`tan ${h} = ${u("motstående","närliggande")}`))}\n    </div>\n    <div class="explorer" id="exp-trig">\n      <p class="eyebrow">Testa själv</p>\n      <label class="range-lbl" for="xt-v">Vinkel ${h}: <output id="xt-out">35°</output></label>\n      <input type="range" id="xt-v" min="15" max="75" value="35">\n      <div class="fig" id="xt-fig"></div>\n      <div class="ratios" id="xt-tbl"></div>\n      <p class="note">Hypotenusan är 10 cm. Förhållandena ändras bara när vinkeln ändras, inte när triangeln görs större eller mindre.</p>\n    </div>\n    ${Ts("Exempel 1: sidan står i täljaren",`<p>${h} = 35°, närliggande katet 8 cm. Sök motstående katet ${v}.</p><p>${k(`tan 35° = ${u(v,"8")}`)} ger ${k(`${v} = 8 · tan 35° ≈ 5,6`)} cm.</p>`)}\n    ${Ts("Exempel 2: sidan står i nämnaren",`<p>${h} = 40°, motstående katet 6 cm. Sök hypotenusan ${v}.</p><p>${k(`sin 40° = ${u("6",v)}`)}. Multiplicera med ${v} och dela med sin 40°: ${k(`${v} = ${u("6","sin 40°")} ≈ 9,3`)} cm.</p>`)}\n    ${Bs("Räknaren:","kontrollera att den står i grader (DEG), inte radianer (RAD). Annars blir alla svar fel.")}`,vinklar:()=>`\n    <p>Känner du två sidor kan du räkna ut vinkeln. Välj det förhållande som innehåller de två sidorna. Använd sedan den <b>inversa</b> funktionen på räknaren, ofta <kbd>SHIFT</kbd> eller <kbd>2nd</kbd> följt av <kbd>sin</kbd>, <kbd>cos</kbd> eller <kbd>tan</kbd>.</p>\n    <div class="formula-row">\n      ${Es(k(`tan ${h} = <i>a</i> &nbsp;⇒&nbsp; ${h} = ${g("tan")}(<i>a</i>)`))}\n      ${Es(k(`sin ${h} = <i>a</i> &nbsp;⇒&nbsp; ${h} = ${g("sin")}(<i>a</i>)`))}\n      ${Es(k(`cos ${h} = <i>a</i> &nbsp;⇒&nbsp; ${h} = ${g("cos")}(<i>a</i>)`))}\n    </div>\n    <div class="fig">${P({angle:32,at:"A",labels:{CB:"5 cm",AC:"8 cm"},angleLabel:"v"})}</div>\n    ${Ts("Exempel",`<p>Motstående katet är 5 cm och närliggande katet är 8 cm.</p><p>${k(`tan ${h} = ${u("5","8")} = 0,625`)} ger ${k(`${h} = ${g("tan")}(0,625) ≈ 32,0°`)}.</p>`)}\n    ${Bs("Rimlighetskontroll:","vinklarna i en triangel är tillsammans 180°, så den andra spetsiga vinkeln blir 90° − v. Är motstående katet kortare än närliggande ska v vara mindre än 45°.")}`,koordinat:()=>`\n    <p>Mellan två punkter A och B i ett koordinatsystem kan du alltid rita en rätvinklig triangel. Kateterna är skillnaderna i x-led och y-led:</p>\n    ${Es(k(`Δ${v} = <i>x</i><sub>B</sub> − <i>x</i><sub>A</sub> &nbsp;&nbsp; Δ<i>y</i> = <i>y</i><sub>B</sub> − <i>y</i><sub>A</sub>`))}\n    <div class="fig">${H({xmin:-1,xmax:7,ymin:-1,ymax:6,scale:30,items:[{t:"seg",x1:1,y1:1,x2:5,y2:1,cls:"seg-dash"},{t:"seg",x1:5,y1:1,x2:5,y2:4,cls:"seg-dash"},{t:"angle",v:[1,1],a:[5,1],b:[5,4],label:"v",r:28},{t:"seg",x1:1,y1:1,x2:5,y2:4},{t:"text",x:3,y:.55,text:"Δx = 4"},{t:"text",x:5.25,y:2.5,text:"Δy = 3",anchor:"start"},{t:"pt",x:1,y:1,label:"A(1, 1)",pos:"nw"},{t:"pt",x:5,y:4,label:"B(5, 4)",pos:"nw"}]})}</div>\n    <h3>Avstånd mellan två punkter</h3>\n    ${Es(k(`<i>d</i> = ${c("(Δ<i>x</i>)² + (Δ<i>y</i>)²")}`))}\n    <h3>Vinkel mot x-axeln</h3>\n    <p>Sett från vinkeln vid A är Δy motstående katet och Δx närliggande katet. Det är samma sak som linjens k-värde.</p>\n    ${Es(k(`tan ${h} = ${u("Δ<i>y</i>","Δ<i>x</i>")} = <i>k</i>`))}\n    ${Ts("Exempel",`<p>A(1, 1) och B(5, 4) ger Δx = 4 och Δy = 3.</p><p>Avståndet: ${k(`<i>d</i> = ${c("4² + 3²")} = ${c("25")} = 5`)} l.e.</p><p>Vinkeln: ${k(`${h} = ${g("tan")}(${u("3","4")}) ≈ 36,9°`)}</p>`)}\n    ${Bs("Tänk på:","Δx och Δy kan bli negativa, men när du kvadrerar blir de alltid positiva.")}`,trigtext:()=>`\n    <p>I textuppgifter är det figuren som avgör. Arbeta i den här ordningen:</p>\n    <ol class="steps-list">\n      <li>Rita en figur.</li>\n      <li>Markera den räta vinkeln, den kända vinkeln och sidorna du vet.</li>\n      <li>Bestäm vilken sida du söker och välj sin, cos eller tan.</li>\n      <li>Ställ upp en ekvation och lös den.</li>\n      <li>Gör en rimlighetskontroll och svara med enhet.</li>\n    </ol>\n    <div class="fig">${P({angle:72,at:"A",labels:{AB:"4 m",CB:"x"},unk:"CB",angleLabel:"72°"})}</div>\n    ${Ts("Exempel: stege",`<p>En 4 m lång stege bildar vinkeln 72° med marken. Hur högt når den?</p><p>Stegen är hypotenusan och höjden är motstående katet: ${k(`sin 72° = ${u(v,"4")}`)} ger ${k(`${v} = 4 · sin 72° ≈ 3,8`)} m.</p><p>Rimligt, eftersom höjden ska vara kortare än stegen.</p>`)}\n    <h3>Ord som brukar dyka upp</h3>\n    <ul class="terms">\n      <li><b>Lutningsvinkel:</b> vinkeln mellan en backe, ramp eller stege och marken.</li>\n      <li><b>Höjdvinkel:</b> vinkeln uppåt från vågrätt till det du tittar på.</li>\n      <li><b>Vågrät och lodrät:</b> horisontell och vertikal. De bildar alltid en rät vinkel.</li>\n    </ul>`,skalar:()=>`\n    <p>En <b>skalär</b> beskrivs med bara ett tal och en enhet, till exempel massa, tid, temperatur, fart och sträcka.</p>\n    <p>En <b>vektor</b> har både <b>storlek och riktning</b>, till exempel förflyttning, hastighet och kraft. En vektor ritas som en pil. Längden visar storleken och pilen visar riktningen.</p>\n    <div class="tbl-wrap"><table class="cmp"><thead><tr><th>Skalär</th><th>Vektor</th></tr></thead><tbody>\n      <tr><td>Farten 50 km/h</td><td>Hastigheten 50 km/h norrut</td></tr>\n      <tr><td>Sträckan 3 km</td><td>Förflyttningen 3 km österut</td></tr>\n      <tr><td>Massan 2 kg</td><td>Kraften 20 N nedåt</td></tr>\n    </tbody></table></div>\n    <div class="fig">${H({xmin:-6,xmax:6,ymin:-3,ymax:4,scale:26,axes:!1,items:[{t:"arrow",x1:-5,y1:-1,x2:-2,y2:1,cls:"u",label:"u"},{t:"arrow",x1:-1,y1:1,x2:2,y2:3,cls:"u",label:"u"},{t:"arrow",x1:5,y1:1,x2:2,y2:-1,cls:"v",label:"−u",side:-1}]})}</div>\n    <p class="caption">De två blå pilarna är samma vektor ${p("u")}: lika långa och med samma riktning, fast de är ritade på olika ställen. Den orange pilen är ${p("−u")}, lika lång men med motsatt riktning.</p>\n    <h3>Beteckningar</h3>\n    <ul class="terms">\n      <li>${p("u")} eller ${p("AB")} betecknar en vektor. ${p("AB")} går från punkten A till punkten B.</li>\n      <li>${k(`|${p("u")}|`)} är vektorns längd, även kallad belopp.</li>\n    </ul>`,vekgrafisk:()=>`\n    <h3>Addition</h3>\n    <p>Lägg ${p("v")} så att dess fot hamnar vid spetsen av ${p("u")}. Summan ${k(`${p("u")} + ${p("v")}`)} går från foten av ${p("u")} till spetsen av ${p("v")}.</p>\n    <h3>Subtraktion</h3>\n    <p>${k(`${p("u")} − ${p("v")} = ${p("u")} + (−${p("v")})`)}. Vänd på ${p("v")} och addera.</p>\n    <h3>Multiplikation med ett tal</h3>\n    <p>${k(`2${p("u")}`)} är dubbelt så lång som ${p("u")} och har samma riktning. Ett negativt tal vänder riktningen.</p>\n    <div class="explorer" id="exp-vec">\n      <p class="eyebrow">Testa själv</p>\n      <div class="vec-ctrl">\n        <span class="m">${p("u")} = (</span><input class="inp sm" id="xu-x" type="number" min="-5" max="5" value="3" aria-label="u x-koordinat"><span class="m">,</span><input class="inp sm" id="xu-y" type="number" min="-5" max="5" value="1" aria-label="u y-koordinat"><span class="m">)</span>\n        <span class="m gap">${p("v")} = (</span><input class="inp sm" id="xv-x" type="number" min="-5" max="5" value="1" aria-label="v x-koordinat"><span class="m">,</span><input class="inp sm" id="xv-y" type="number" min="-5" max="5" value="3" aria-label="v y-koordinat"><span class="m">)</span>\n      </div>\n      <div class="segctl" role="group" aria-label="Räknesätt">\n        <button type="button" data-op="add" aria-pressed="true">${p("u")} + ${p("v")}</button>\n        <button type="button" data-op="sub" aria-pressed="false">${p("u")} − ${p("v")}</button>\n        <button type="button" data-op="mul" aria-pressed="false">2${p("u")}</button>\n      </div>\n      <div class="fig" id="xv-fig"></div>\n      <p class="note" id="xv-txt"></p>\n    </div>\n    ${Bs("Ordningen:",`vid addition spelar ordningen ingen roll, ${k(`${p("u")} + ${p("v")} = ${p("v")} + ${p("u")}`)}. Vid subtraktion gör den det: ${k(`${p("v")} − ${p("u")}`)} pekar åt motsatt håll mot ${k(`${p("u")} − ${p("v")}`)}.`)}`,vekkoord:()=>`\n    <p>${k(`${p("u")} = (3, −2)`)} betyder 3 steg åt höger i x-led och 2 steg nedåt i y-led. Talen kallas vektorns <b>koordinater</b> eller komponenter.</p>\n    <div class="fig">${H({xmin:-1,xmax:5,ymin:-3,ymax:2,scale:32,items:[{t:"arrow",x1:0,y1:0,x2:3,y2:-2,cls:"u",label:"u",side:-1}]})}</div>\n    <h3>Räkna komponentvis</h3>\n    <div class="formula-row">\n      ${Es(k("(<i>a</i>, <i>b</i>) + (<i>c</i>, <i>d</i>) = (<i>a</i> + <i>c</i>, <i>b</i> + <i>d</i>)"))}\n      ${Es(k("(<i>a</i>, <i>b</i>) − (<i>c</i>, <i>d</i>) = (<i>a</i> − <i>c</i>, <i>b</i> − <i>d</i>)"))}\n      ${Es(k("<i>k</i> · (<i>a</i>, <i>b</i>) = (<i>ka</i>, <i>kb</i>)"))}\n    </div>\n    <h3>Vektor mellan två punkter</h3>\n    ${Es(k(`${p("AB")} = (<i>x</i><sub>B</sub> − <i>x</i><sub>A</sub>, <i>y</i><sub>B</sub> − <i>y</i><sub>A</sub>)`))}\n    <p>Kom ihåg det som <b>spets minus fot</b>.</p>\n    ${Ts("Exempel 1",`<p>${k(`${p("u")} = (3, −2)`)} och ${k(`${p("v")} = (−1, 4)`)}.</p><p>${k(`2${p("u")} − ${p("v")} = (6, −4) − (−1, 4) = (6 + 1, −4 − 4) = (7, −8)`)}</p>`)}\n    ${Ts("Exempel 2",`<p>A(2, 1) och B(−3, 4).</p><p>${k(`${p("AB")} = (−3 − 2, 4 − 1) = (−5, 3)`)}</p>`)}\n    ${Bs("Tecknen:","minus ett negativt tal blir plus, till exempel 6 − (−1) = 7.")}`,veklangd:()=>`\n    <p>Längden av en vektor, även kallad <b>beloppet</b>, räknas med Pythagoras sats. Koordinaterna är kateterna i en rätvinklig triangel.</p>\n    ${Es(k(`|${p("u")}| = ${c("<i>x</i>² + <i>y</i>²")}`)+" &nbsp; om "+k(`${p("u")} = (<i>x</i>, <i>y</i>)`))}\n    <div class="fig">${H({xmin:-4,xmax:1,ymin:-1,ymax:5,scale:32,items:[{t:"seg",x1:0,y1:0,x2:-3,y2:0,cls:"seg-dash"},{t:"seg",x1:-3,y1:0,x2:-3,y2:4,cls:"seg-dash"},{t:"arrow",x1:0,y1:0,x2:-3,y2:4,cls:"u",label:"u"}]})}</div>\n    ${Ts("Exempel 1",`<p>${k(`${p("u")} = (−3, 4)`)}</p><p>${k(`|${p("u")}| = ${c("(−3)² + 4²")} = ${c("9 + 16")} = ${c("25")} = 5`)}</p>`)}\n    ${Ts("Exempel 2",`<p>${k(`${p("u")} = (2, −5)`)}</p><p>${k(`|${p("u")}| = ${c("2² + (−5)²")} = ${c("29")} ≈ 5,4`)}</p>`)}\n    <p>Längden av ${p("AB")} är samma sak som avståndet mellan punkterna A och B.</p>\n    ${Bs("Räknaren:","skriv parentes runt negativa tal, (−3)². Utan parentes räknar många räknare −3² = −9.")}`};Object.assign(Ss,{koordprop:()=>`\n    <p>Ett koordinatsystem har en vågrät <b>x-axel</b> och en lodrät <b>y-axel</b>. De möts i <b>origo</b>, punkten (0, 0). En punkt beskrivs med två koordinater (x, y): först hur långt åt sidan, sedan hur långt upp eller ner.</p>\n    <div class="fig">${Re([{t:"text",x:3,y:4.2,text:"Första",cls:"q-lbl"},{t:"text",x:-3,y:4.2,text:"Andra",cls:"q-lbl"},{t:"text",x:-3,y:-4.2,text:"Tredje",cls:"q-lbl"},{t:"text",x:3,y:-4.2,text:"Fjärde",cls:"q-lbl"},{t:"pt",x:3,y:2,label:"P(3, 2)",pos:"ne"},{t:"pt",x:-4,y:-1,label:"Q(−4, −1)",pos:"nw"}],{xmin:-6,xmax:6,ymin:-5,ymax:5})}</div>\n    <p>Axlarna delar planet i fyra <b>kvadranter</b>. De numreras moturs, med start uppe till höger där både x och y är positiva.</p>\n    <h3>Proportionalitet</h3>\n    <p>Två storheter är <b>proportionella</b> om den ena är ett tal gånger den andra. Kvoten y/x är då alltid densamma, och grafen är en rät linje genom origo. Talet k kallas proportionalitetskonstant.</p>\n    <div class="formula-row">${Es(k("<i>y</i> = <i>kx</i>"))}${Es(k(`<i>k</i> = ${u("<i>y</i>","<i>x</i>")}`))}</div>\n    ${Ts("Exempel",`<p>3 kg äpplen kostar 66 kr, och priset är proportionellt mot vikten. Vad kostar 5 kg?</p><p>${k(`<i>k</i> = ${u("66","3")} = 22`)} kr per kg, så 5 kg kostar ${k("22 · 5 = 110")} kr.</p>`)}\n    ${Bs("Vanligt misstag:","att tro att skillnaden mellan y och x är konstant. Vid proportionalitet är det kvoten som är konstant.")}`,linmodell:()=>`\n    <p>Ett <b>linjärt samband</b> skrivs ${k("<i>y</i> = <i>kx</i> + <i>m</i>")}. Grafen är en rät linje.</p>\n    <ul class="terms">\n      <li><b>m</b> är startvärdet, alltså y när x = 0. Där skär linjen y-axeln.</li>\n      <li><b>k</b> är hur mycket y ändras när x ökar med 1. Positivt k betyder att y ökar, negativt k att y minskar.</li>\n    </ul>\n    <div class="fig">${Re([{t:"line",k:-2,m:10,from:0,to:5},{t:"pt",x:0,y:10,label:"start 10 cm",pos:"ne"},{t:"pt",x:5,y:0,label:"slut efter 5 h",pos:"ne"}],{xmin:-1,xmax:8,ymin:-1,ymax:11,scale:22})}</div>\n    ${Ts("Exempel: ljus",`<p>Ett ljus är 10 cm långt och brinner ner 2 cm per timme. Längden efter x timmar är ${Se(-2,10)}.</p><p>Efter 3 timmar: ${k("<i>y</i> = −2 · 3 + 10 = 4")} cm.</p><p>När är ljuset slut? ${k("0 = −2<i>x</i> + 10")} ger ${k("<i>x</i> = 5")} timmar.</p>`)}\n    ${Bs("Läs texten efter två saker:","vad startvärdet är (m), och hur mycket det ändras per enhet (k).")}`,ekvgraf:()=>`\n    <p>En rät linje kan skrivas på <b>k-form</b>: ${k("<i>y</i> = <i>kx</i> + <i>m</i>")}.</p>\n    <ul class="terms">\n      <li><b>k-värdet</b> (lutningen) säger hur många steg y ändras när x ökar med 1.</li>\n      <li><b>m-värdet</b> är y-koordinaten där linjen skär y-axeln.</li>\n    </ul>\n    <div class="fig">${Re([{t:"seg",x1:1,y1:1,x2:2,y2:1,cls:"seg-dash"},{t:"seg",x1:2,y1:1,x2:2,y2:3,cls:"seg-dash"},{t:"line",k:2,m:-1},{t:"text",x:1.5,y:.5,text:"1"},{t:"text",x:2.4,y:2,text:"2"},{t:"pt",x:0,y:-1,label:"m = −1",pos:"se"}])}</div>\n    <p class="caption">Linjen ${Se(2,-1)}: ett steg åt höger ger två steg upp, och linjen skär y-axeln i −1.</p>\n    <h3>Rita linjen från ekvationen</h3>\n    <ol class="steps-list"><li>Pricka in m på y-axeln.</li><li>Gå 1 steg åt höger och k steg upp, eller ner om k är negativt.</li><li>Dra linjen genom punkterna.</li></ol>\n    <div class="explorer" id="exp-line">\n      <p class="eyebrow">Testa själv</p>\n      <label class="range-lbl" for="xl-k">k = <output id="xl-ko">1</output></label>\n      <input type="range" id="xl-k" min="-3" max="3" step="0.5" value="1">\n      <label class="range-lbl" for="xl-m">m = <output id="xl-mo">2</output></label>\n      <input type="range" id="xl-m" min="-5" max="5" step="1" value="2">\n      <div class="fig" id="xl-fig"></div>\n      <p class="note" id="xl-txt"></p>\n    </div>\n    <h3>Allmän form</h3>\n    <p>Ibland skrivs linjen som ${k("<i>ax</i> + <i>by</i> + <i>c</i> = 0")}. Lös ut y för att få k-form.</p>\n    ${Ts("Exempel",`<p>${k("2<i>x</i> + <i>y</i> − 4 = 0")} ger ${Se(-2,4)}, alltså k = −2 och m = 4.</p>`)}\n    <h3>Ligger punkten på linjen?</h3>\n    <p>Sätt in punktens x-värde i ekvationen. Får du punktens y-värde ligger punkten på linjen. Punkten (3, 5) ligger på ${Se(2,-1)} eftersom ${k("2 · 3 − 1 = 5")}.</p>`,grafekv:()=>`\n    <p>Om du känner två punkter på linjen kan du räkna ut k-värdet:</p>\n    ${Es(k(`<i>k</i> = ${u("Δ<i>y</i>","Δ<i>x</i>")} = ${u("<i>y</i><sub>2</sub> − <i>y</i><sub>1</sub>","<i>x</i><sub>2</sub> − <i>x</i><sub>1</sub>")}`))}\n    <div class="fig">${Re([{t:"seg",x1:-1,y1:1,x2:3,y2:1,cls:"seg-dash"},{t:"seg",x1:3,y1:1,x2:3,y2:3,cls:"seg-dash"},{t:"line",k:.5,m:1.5},{t:"text",x:1,y:.5,text:"Δx = 4"},{t:"text",x:3.3,y:2,text:"Δy = 2",anchor:"start"},{t:"pt",x:-1,y:1,label:"(−1, 1)",pos:"nw"},{t:"pt",x:3,y:3,label:"(3, 3)",pos:"nw"}])}</div>\n    ${Ts("Exempel",`<p>Linjen går genom (−1, 1) och (3, 3).</p><p>${k(`<i>k</i> = ${u("3 − 1","3 − (−1)")} = ${u("2","4")} = ${u("1","2")}`)}</p><p>Sätt in (3, 3) i ${k("<i>y</i> = <i>kx</i> + <i>m</i>")}: ${k(`3 = ${u("1","2")} · 3 + <i>m</i>`)} ger ${k("<i>m</i> = 1,5")}.</p><p>Svar: ${Se(be(1,2),1.5)}</p>`)}\n    <h3>Läsa av en graf</h3>\n    <p>Läs av m där linjen skär y-axeln. Leta sedan upp en punkt där linjen går genom ett hörn i rutnätet och räkna steg: k = steg upp (eller ner) delat med steg åt höger.</p>\n    <h3>Enpunktsform</h3>\n    ${Es(k("<i>y</i> − <i>y</i><sub>1</sub> = <i>k</i>(<i>x</i> − <i>x</i><sub>1</sub>)"))}\n    <p>Den passar när du vet k och en punkt. Förenkla sedan till k-form.</p>\n    ${Ts("Exempel",`<p>k = 3 och punkten (2, 5): ${k("<i>y</i> − 5 = 3(<i>x</i> − 2)")}, alltså ${k("<i>y</i> = 3<i>x</i> − 6 + 5")} = ${Se(3,-1)}.</p>`)}\n    ${Bs("Tänk på:","ta punkterna i samma ordning i täljaren och nämnaren. Annars får k fel tecken.")}`,parvink:()=>`\n    <p><b>Parallella</b> linjer lutar lika mycket. De har samma k-värde men olika m-värde.</p>\n    ${Es(k("<i>k</i><sub>1</sub> = <i>k</i><sub>2</sub>"))}\n    <p><b>Vinkelräta</b> linjer skär varandra i rät vinkel. Produkten av deras k-värden är −1.</p>\n    ${Es(k("<i>k</i><sub>1</sub> · <i>k</i><sub>2</sub> = −1"))}\n    <div class="fig">${Re([{t:"line",k:2,m:1,label:"A"},{t:"line",k:2,m:-3,label:"B"},{t:"line",k:-.5,m:1,cls:"line-alt",label:"C",alt:!0}])}</div>\n    <p class="caption">A: ${Se(2,1)} och B: ${Se(2,-3)} är parallella. C: ${Se(be(-1,2),1)} är vinkelrät mot båda, eftersom ${k(`2 · (−${u("1","2")}) = −1`)}.</p>\n    ${Ts("Exempel",`<p>Bestäm linjen som är vinkelrät mot ${Se(2,1)} och går genom (2, 3).</p><p>${k(`<i>k</i> = −${u("1","2")}`)}. Sätt in punkten: ${k(`3 = −${u("1","2")} · 2 + <i>m</i>`)} ger m = 4.</p><p>Svar: ${Se(be(-1,2),4)}</p>`)}\n    ${Bs("Snabbregel:","för en vinkelrät linje vänder du på k-värdet och byter tecken. 2/3 blir −3/2, och 4 blir −1/4.")}`,funktion:()=>`\n    <p>En <b>funktion</b> är en regel som ger exakt ett y-värde för varje x-värde. Vi skriver ${k(Ve())} och läser det som "f av x".</p>\n    <p><b>Funktionsvärdet</b> ${k("<i>f</i>(3)")} får du genom att sätta in x = 3 i funktionen. Det är samma sak som grafens y-värde när x = 3.</p>\n    ${Ts("Exempel",`<p>${k(`${Ve()} = 2<i>x</i>² − 3<i>x</i>`)}</p><p>${k("<i>f</i>(−2) = 2 · (−2)² − 3 · (−2) = 8 + 6 = 14")}</p>`)}\n    <h3>Två sorters frågor</h3>\n    <ul class="terms">\n      <li>${k("<i>f</i>(4) = ?")} Sätt in x = 4 och räkna ut y.</li>\n      <li>${k(`${Ve()} = 4`)}? Leta upp vilket x som ger y = 4. Det är en ekvation.</li>\n    </ul>\n    <h3>Grafisk ekvationslösning</h3>\n    <p>Ekvationen ${k(`${Ve("f")} = ${Ve("g")}`)} kan du lösa genom att rita båda graferna. Lösningen är x-koordinaten i skärningspunkten. I en grafritande räknare, Desmos eller GeoGebra finns ett verktyg för skärningspunkter.</p>\n    <div class="fig">${Re([{t:"line",k:.5,m:1,label:"f"},{t:"line",k:-1,m:4,cls:"line-alt",label:"g",alt:!0},{t:"pt",x:2,y:2,label:"(2, 2)",pos:"ne"}])}</div>\n    <p class="caption">${k(`${Ve("f")} = 0,5<i>x</i> + 1`)} och ${k(`${Ve("g")} = −<i>x</i> + 4`)} skär varandra i (2, 2). Lösningen är x = 2.</p>\n    ${Bs("Kom ihåg:","f(2) = 5 betyder att punkten (2, 5) ligger på grafen.")}`,defvarde:()=>`\n    <p><b>Definitionsmängden</b> är alla x-värden som funktionen gäller för. <b>Värdemängden</b> är alla y-värden som funktionen antar.</p>\n    <div class="fig">${Re([{t:"line",k:-1,m:4,from:-1,to:3},{t:"pt",x:-1,y:5,label:"(−1, 5)",pos:"ne"},{t:"pt",x:3,y:1,label:"(3, 1)",pos:"ne"}])}</div>\n    <p class="caption">Grafen finns från x = −1 till x = 3. Definitionsmängd: ${k("−1 ≤ <i>x</i> ≤ 3")}. Värdemängd: ${k("1 ≤ <i>y</i> ≤ 5")}.</p>\n    <h3>Räkna ut värdemängden</h3>\n    <p>För en linjär funktion antas det minsta och största värdet i ändpunkterna. Räkna ut funktionsvärdet där och skriv det minsta först.</p>\n    ${Ts("Exempel",`<p>${k(`${Ve()} = 3<i>x</i> − 2`)} med ${k("1 ≤ <i>x</i> ≤ 5")}.</p><p>${k("<i>f</i>(1) = 1")} och ${k("<i>f</i>(5) = 13")}, så värdemängden är ${k("1 ≤ <i>y</i> ≤ 13")}.</p>`)}\n    <h3>I verkligheten</h3>\n    <p>I en modell sätter situationen gränserna. Tiden kan inte vara negativ, och ett ljus kan inte bli kortare än 0 cm.</p>\n    ${Bs("Minnesregel:","definitionsmängden hör ihop med x och värdemängden med y.")}`,expfunk:()=>`\n    <p>När något ökar eller minskar med <b>samma procent</b> varje gång beskrivs det av en <b>exponentialfunktion</b>:</p>\n    ${Es(k(`${Ve()} = <i>C</i> · <i>a</i><sup><i>x</i></sup>`))}\n    <ul class="terms">\n      <li><b>C</b> är startvärdet, alltså värdet när x = 0.</li>\n      <li><b>a</b> är förändringsfaktorn. Om a &gt; 1 ökar värdet, om 0 &lt; a &lt; 1 minskar det.</li>\n    </ul>\n    <h3>Förändringsfaktor</h3>\n    <p>En ökning med 6 % ger a = 1,06. En minskning med 15 % ger a = 0,85, eftersom 85 % finns kvar.</p>\n    <div class="explorer" id="exp-exp">\n      <p class="eyebrow">Testa själv</p>\n      <label class="range-lbl" for="xe-a">a = <output id="xe-ao">1,2</output></label>\n      <input type="range" id="xe-a" min="0.5" max="1.5" step="0.05" value="1.2">\n      <div class="fig" id="xe-fig"></div>\n      <p class="note" id="xe-txt"></p>\n    </div>\n    ${Ts("Exempel",`<p>En bil kostar 250 000 kr och värdet minskar med 12 % per år.</p><p>${k("<i>V</i>(<i>x</i>) = 250 000 · 0,88<sup><i>x</i></sup>")}</p><p>Efter 5 år: ${k("250 000 · 0,88<sup>5</sup> ≈ 131 933")} kr.</p>`)}\n    <h3>Linjär eller exponentiell?</h3>\n    <p>Ändras något med lika många enheter varje gång är det linjärt. Ändras det med lika många procent är det exponentiellt.</p>\n    ${Bs("Vanligt misstag:","att räkna 250 000 · 0,88 · 5. Exponenten betyder att du multiplicerar med 0,88 fem gånger.")}`,potfunk:()=>`\n    <p>En <b>potensfunktion</b> har formen</p>\n    ${Es(k(`${Ve()} = <i>C</i> · <i>x</i><sup><i>a</i></sup>`))}\n    <p>Här står x i <b>basen</b>. I en exponentialfunktion står x i exponenten.</p>\n    <div class="fig">${Re([{t:"fn",f:e=>e*e,label:"f",lx:1.6},{t:"fn",f:e=>4/e,from:.45,to:6,alt:!0,label:"g",lx:3.2}],{xmin:-4,xmax:6,ymin:-2,ymax:9,scale:24})}</div>\n    <p class="caption">${k(`${Ve("f")} = <i>x</i>²`)} och ${k(`${Ve("g")} = ${u("4","<i>x</i>")}`)} (för x &gt; 0) är båda potensfunktioner.</p>\n    <div class="tbl-wrap"><table class="cmp"><thead><tr><th>Funktion</th><th>Exponent</th></tr></thead><tbody>\n      <tr><td>${k(`${Ve()} = 3<i>x</i>²`)}</td><td>2</td></tr>\n      <tr><td>${k(`${Ve()} = 2<i>x</i>³`)}</td><td>3</td></tr>\n      <tr><td>${k(`${Ve()} = ${u("12","<i>x</i>")} = 12<i>x</i><sup>−1</sup>`)}</td><td>−1</td></tr>\n    </tbody></table></div>\n    <h3>Proportionalitet med potenser</h3>\n    <p>Om ${k("<i>y</i> = <i>kx</i>²")} och x fördubblas blir y fyra gånger så stort, eftersom ${k("(2<i>x</i>)² = 4<i>x</i>²")}. Om ${k(`<i>y</i> = ${u("<i>k</i>","<i>x</i>")}`)} (omvänt proportionell) och x fördubblas halveras y.</p>\n    ${Ts("Exempel",`<p>${k(`${Ve()} = <i>C</i> · <i>x</i>²`)} går genom (3, 36).</p><p>${k("<i>C</i> · 3² = 36")}, alltså ${k("9<i>C</i> = 36")} och ${k("<i>C</i> = 4")}.</p>`)}\n    ${Bs("Räkna potensen först:","3 · 4² = 3 · 16 = 48, inte (3 · 4)² = 144.")}`}),Object.assign(Ss,{k1tal:()=>`\n    <p>Talen delas in i <b>talmängder</b>. Varje talmängd innehåller den föregående.</p>\n    <ul class="terms">\n      <li><b>N</b>, naturliga tal: 0, 1, 2, 3 och så vidare.</li>\n      <li><b>Z</b>, hela tal: de naturliga talen och de negativa heltalen, till exempel −5.</li>\n      <li><b>Q</b>, rationella tal: alla tal som kan skrivas som ett bråk ${k(u("<i>a</i>","<i>b</i>"))} av två heltal, till exempel ${k(u(3,4))}, −0,25 och 0,333…</li>\n      <li><b>R</b>, reella tal: alla tal på tallinjen. Hit hör också de <b>irrationella</b> talen, som ${k(c("2"))} och π, som inte kan skrivas som bråk.</li>\n    </ul>\n    <div class="fig">${function(){const e=(e,t,n,a)=>`<rect class="ra" x="${e}" y="${t}" width="${n}" height="${a}" rx="10"/>`;return'<svg viewBox="0 0 420 216" role="img" aria-label="Talmängderna N, Z, Q och R ritade inuti varandra">'+e(2,2,416,212)+e(16,30,304,172)+e(30,58,196,132)+e(44,86,96,92)+E([12,16],"R reella tal","q-lbl","start")+E([26,44],"Q rationella tal","q-lbl","start")+E([40,72],"Z hela tal","q-lbl","start")+E([52,100],"N naturliga","q-lbl","start")+E([92,128],"0, 1, 7","pt-lbl")+E([92,156],"25","pt-lbl")+E([183,118],"−3","pt-lbl")+E([183,152],"−20","pt-lbl")+E([272,96],"½","pt-lbl")+E([272,130],"−0,25","pt-lbl")+E([272,164],"0,333…","pt-lbl")+E([370,96],"√2","pt-lbl")+E([370,136],"π","pt-lbl")+"</svg>"}()}</div>\n    <h3>Räkna med negativa tal</h3>\n    <div class="formula-row">${Es(k("<i>a</i> − (−<i>b</i>) = <i>a</i> + <i>b</i>"))}${Es(k("(−<i>a</i>) · (−<i>b</i>) = <i>ab</i>"))}${Es(k("(−<i>a</i>) · <i>b</i> = −<i>ab</i>"))}</div>\n    <p>Samma teckenregler gäller vid division: lika tecken ger plus och olika tecken ger minus.</p>\n    <div class="fig">${function(){const e=e=>22+37.6*(e- -6);let t=`<svg viewBox="0 0 420 70" role="img" aria-label="Tallinje från ${n(-6,0)} till ${n(4,0)}">`;t+='<line class="g-axis" x1="14" y1="40" x2="406" y2="40"/><polygon class="g-head" points="412,40 404,36 404,44"/>';for(let a=-6;a<=4;a++)t+=`<line class="g-axis" x1="${e(a)}" y1="35" x2="${e(a)}" y2="45"/>`+E([e(a),57],n(a,0),"g-num");for(const[n,a]of[[-4,"−4"],[-1,"−1"],[2,"2"]])t+=`<circle class="pt" cx="${e(n)}" cy="40" r="4.5"/>`+E([e(n),24],a,"pt-lbl");return t+"</svg>"}()}</div>\n    <p class="caption">Ju längre till vänster på tallinjen, desto mindre tal. −4 är mindre än −1.</p>\n    ${Ts("Exempel",`<p>${k("−3 − (−5) = −3 + 5 = 2")}</p><p>${k("(−4) · (−2) = 8")}</p><p>${k(`${u("−12","3")} = −4`)}</p>`)}\n    ${Bs("Vanligt misstag:","att tro att −7 är större än −2 eftersom 7 är större än 2. På tallinjen ligger −7 längre till vänster, så −7 &lt; −2.")}`,k1brakas:()=>`\n    <p>Ett <b>bråk</b> har en täljare och en nämnare. Du kan <b>förlänga</b> ett bråk, alltså multiplicera täljare och nämnare med samma tal, eller <b>förkorta</b> det, alltså dela båda med samma tal. Värdet ändras inte.</p>\n    <div class="formula-row">${Es(k(`${u(3,4)} = ${u("3 · 5","4 · 5")} = ${u(15,20)}`))}${Es(k(`${u(18,24)} = ${u("18/6","24/6")} = ${u(3,4)}`))}</div>\n    <h3>Addition och subtraktion</h3>\n    <p>Bråken måste ha samma nämnare. Gör dem <b>liknämniga</b> med den <b>minsta gemensamma nämnaren</b>, alltså det minsta tal som båda nämnarna går jämnt upp i. Addera eller subtrahera sedan täljarna. Nämnaren ändras inte.</p>\n    ${Es(k(`${u("<i>a</i>","<i>c</i>")} + ${u("<i>b</i>","<i>c</i>")} = ${u("<i>a</i> + <i>b</i>","<i>c</i>")}`))}\n    ${Ts("Exempel",`<p>${k(`${u(5,6)} − ${u(3,8)}`)}. Den minsta gemensamma nämnaren är 24.</p><p>${k(`${u(5,6)} − ${u(3,8)} = ${u(20,24)} − ${u(9,24)} = ${u(11,24)}`)}</p>`)}\n    <h3>Blandad form</h3>\n    <p>${k(Lt(2,3,4))} betyder ${k(`2 + ${u(3,4)}`)}. Skriv heltalet med samma nämnare: ${k(`2 = ${u(8,4)}`)}, så ${k(`${Lt(2,3,4)} = ${u(11,4)}`)}. Åt andra hållet: 4 går 2 gånger i 11 med resten 3.</p>\n    ${Bs("Vanligt misstag:",`att addera nämnarna. ${k(`${u(1,2)} + ${u(1,3)}`)} är inte ${k(u(2,5))}, utan ${k(`${u(3,6)} + ${u(2,6)} = ${u(5,6)}`)}.`)}\n    <p class="note">I appen skriver du bråk som 11/4. Skriv inte blandad form, utan 11/4 eller 2,75.</p>`,k1brakmd:()=>`\n    <p>Vid multiplikation behöver bråken inte vara liknämniga. Multiplicera täljare med täljare och nämnare med nämnare.</p>\n    ${Es(k(`${u("<i>a</i>","<i>b</i>")} · ${u("<i>c</i>","<i>d</i>")} = ${u("<i>a</i> · <i>c</i>","<i>b</i> · <i>d</i>")}`))}\n    <p>Ett heltal gånger ett bråk: multiplicera bara täljaren, ${k(`3 · ${u(2,7)} = ${u(6,7)}`)}. Ordet <b>av</b> betyder gånger: en tredjedel av ${k(u(2,5))} är ${k(`${u(1,3)} · ${u(2,5)} = ${u(2,15)}`)}.</p>\n    <h3>Division</h3>\n    <p>Att dela med ett bråk är samma sak som att multiplicera med det <b>inverterade</b> bråket, alltså bråket vänt upp och ner.</p>\n    ${Es(k(`${u(u("<i>a</i>","<i>b</i>"),u("<i>c</i>","<i>d</i>"))} = ${u("<i>a</i>","<i>b</i>")} · ${u("<i>d</i>","<i>c</i>")}`))}\n    ${Ts("Exempel",`<p>${k(`${u(u(2,3),u(4,5))} = ${u(2,3)} · ${u(5,4)} = ${u(10,12)} = ${u(5,6)}`)}</p><p>Hur många glas på ${k(u(1,4))} liter kan du fylla med 3 liter? ${k(`${u(3,u(1,4))} = 3 · 4 = 12`)} glas.</p>`)}\n    ${Bs("Vanligt misstag:",`att multiplicera både täljaren och nämnaren med heltalet. ${k(`3 · ${u(2,7)}`)} är ${k(u(6,7))}, inte ${k(u(6,21))}.`)}`,k1decimal:()=>`\n    <p>Ett tal kan skrivas i <b>bråkform</b>, i <b>decimalform</b> eller i <b>procent</b>. Procent betyder hundradelar.</p>\n    ${Es(k(`${u(7,20)} = ${u(35,100)} = 0,35 = 35 %`))}\n    <div class="tbl-wrap"><table class="cmp"><thead><tr><th>Bråkform</th><th>Decimalform</th><th>Procent</th></tr></thead><tbody>\n      <tr><td>${k(u(1,2))}</td><td>0,5</td><td>50 %</td></tr>\n      <tr><td>${k(u(1,4))}</td><td>0,25</td><td>25 %</td></tr>\n      <tr><td>${k(u(3,4))}</td><td>0,75</td><td>75 %</td></tr>\n      <tr><td>${k(u(1,5))}</td><td>0,2</td><td>20 %</td></tr>\n      <tr><td>${k(u(1,8))}</td><td>0,125</td><td>12,5 %</td></tr>\n      <tr><td>${k(u(1,3))}</td><td>0,333…</td><td>ungefär 33,3 %</td></tr>\n    </tbody></table></div>\n    <ul class="terms">\n      <li><b>Bråk till decimalform:</b> dela täljaren med nämnaren, eller förläng till tiondelar, hundradelar eller tusendelar: ${k(`${u(7,20)} = ${u(35,100)} = 0,35`)}.</li>\n      <li><b>Decimalform till procent:</b> multiplicera med 100. 0,045 = 4,5 %.</li>\n      <li><b>Decimalform till bråk:</b> ${k(`0,35 = ${u(35,100)} = ${u(7,20)}`)}.</li>\n    </ul>\n    <h3>Avrundning</h3>\n    <p>Titta på siffran efter den sista du ska behålla. Är den 5 eller större avrundar du uppåt, annars nedåt.</p>\n    <p><b>Värdesiffror</b> räknas från den första siffran som inte är 0. Talet 0,004783 har fyra värdesiffror. Med två värdesiffror blir det 0,0048.</p>\n    ${Ts("Exempel",`<p>3,1468 med två decimaler: den tredje decimalen är 6, så ${k("3,1468 ≈ 3,15")}.</p><p>45 682 med två värdesiffror: ${k("45 682 ≈ 46 000")}. Nollorna behövs för att talet ska behålla sin storlek.</p>`)}\n    ${Bs("Jämför decimaltal:","fler siffror betyder inte ett större tal. 0,5 är större än 0,125. Skriv gärna talen med lika många decimaler: 0,500 och 0,125.")}`,k1potens:()=>`\n    <p>En <b>potens</b> ${k(Ft("<i>a</i>","<i>n</i>"))} är en upprepad multiplikation. Talet <i>a</i> kallas <b>bas</b> och <i>n</i> kallas <b>exponent</b>.</p>\n    ${Es(k(`${Ft(2,5)} = 2 · 2 · 2 · 2 · 2 = 32`))}\n    <h3>Potenslagar</h3>\n    <div class="formula-row">\n      ${Es(k(`${Ft("<i>a</i>","<i>x</i>")} · ${Ft("<i>a</i>","<i>y</i>")} = ${Ft("<i>a</i>","<i>x</i> + <i>y</i>")}`))}\n      ${Es(k(`${u(Ft("<i>a</i>","<i>x</i>"),Ft("<i>a</i>","<i>y</i>"))} = ${Ft("<i>a</i>","<i>x</i> − <i>y</i>")}`))}\n      ${Es(k(`(${Ft("<i>a</i>","<i>x</i>")})<sup><i>y</i></sup> = ${Ft("<i>a</i>","<i>xy</i>")}`))}\n      ${Es(k(`${Ft("<i>a</i>","<i>x</i>")} · ${Ft("<i>b</i>","<i>x</i>")} = (<i>ab</i>)<sup><i>x</i></sup>`))}\n      ${Es(k(`${u(Ft("<i>a</i>","<i>x</i>"),Ft("<i>b</i>","<i>x</i>"))} = (${u("<i>a</i>","<i>b</i>")})<sup><i>x</i></sup>`))}\n    </div>\n    <p>De tre första lagarna gäller när baserna är lika. Ofta kan du skriva om talen så att de får samma bas, till exempel ${k(`8 = ${Ft(2,3)}`)} och ${k(`9 = ${Ft(3,2)}`)}.</p>\n    ${Ts("Exempel",`<p>${k(`${Ft(2,3)} · ${Ft(2,4)} = ${Ft(2,"3 + 4")} = ${Ft(2,7)}`)}</p><p>${k(`${Ft(`(${Ft(v,3)})`,2)} = ${Ft(v,"3 · 2")} = ${Ft(v,6)}`)}</p><p>${k(`${Ft(`(2${Ft(v,3)})`,2)} = ${Ft(2,2)} · ${Ft(v,6)} = 4${Ft(v,6)}`)}</p><p>${k(`${Ft(2,3)} · ${Ft(5,3)} = ${Ft(10,3)} = 1000`)}</p>`)}\n    ${Bs("Vanligt misstag:",`att multiplicera exponenterna vid multiplikation. ${k(`${Ft(2,3)} · ${Ft(2,4)} = ${Ft(2,7)}`)}, inte ${k(Ft(2,12))}. Exponenterna multipliceras bara vid potens av en potens.`)}`,k1negexp:()=>`\n    <p>Potenslagen för division förklarar vad exponenten 0 och negativa exponenter betyder.</p>\n    <ul class="terms">\n      <li>${k(`${u(Ft(2,3),Ft(2,3))} = ${Ft(2,0)}`)}, men också ${k(`${u(8,8)} = 1`)}. Alltså är ${k(`${Ft(2,0)} = 1`)}.</li>\n      <li>${k(`${u(Ft(2,2),Ft(2,5))} = ${Ft(2,-3)}`)}, men också ${k(`${u("2 · 2","2 · 2 · 2 · 2 · 2")} = ${u(1,Ft(2,3))}`)}. Alltså är ${k(`${Ft(2,-3)} = ${u(1,8)}`)}.</li>\n    </ul>\n    <div class="formula-row">${Es(k(`${Ft("<i>a</i>",0)} = 1`))}${Es(k(`${Ft("<i>a</i>","−<i>n</i>")} = ${u(1,Ft("<i>a</i>","<i>n</i>"))}`))}</div>\n    <div class="tbl-wrap"><table class="cmp"><thead><tr><th>Tiopotens</th><th>Värde</th></tr></thead><tbody>\n      <tr><td>${k(Ct(3))}</td><td>1000</td></tr><tr><td>${k(Ct(1))}</td><td>10</td></tr><tr><td>${k(Ct(0))}</td><td>1</td></tr>\n      <tr><td>${k(Ct(-1))}</td><td>0,1</td></tr><tr><td>${k(Ct(-2))}</td><td>0,01</td></tr><tr><td>${k(Ct(-3))}</td><td>0,001</td></tr>\n    </tbody></table></div>\n    ${Ts("Exempel",`<p>${k(`${Ft(2,-3)} = ${u(1,Ft(2,3))} = ${u(1,8)}`)}</p><p>${k(`${Ft(`(${u(2,3)})`,-1)} = ${u(3,2)}`)}</p><p>${k(`${Ft("<i>a</i>",-2)} · ${Ft("<i>a</i>",5)} = ${Ft("<i>a</i>","−2 + 5")} = ${Ft("<i>a</i>",3)}`)}</p>`)}\n    ${Bs("Vanligt misstag:",`att tro att en negativ exponent ger ett negativt tal. ${k(`${Ft(2,-3)} = ${u(1,8)}`)}, inte −8.`)}`,k1rotexp:()=>`\n    <p>${k(Ft("<i>a</i>","1/2"))} är det positiva tal som multiplicerat med sig självt blir <i>a</i>, alltså ${k(c("<i>a</i>"))}. På samma sätt är ${k(Ft("<i>a</i>","1/<i>n</i>"))} den <i>n</i>:te roten ur <i>a</i>.</p>\n    <div class="formula-row">${Es(k(`${Ft("<i>a</i>","1/<i>n</i>")} = ${Ht("<i>n</i>","<i>a</i>")}`))}${Es(k(`${Ft("<i>a</i>","<i>p</i>/<i>q</i>")} = (${Ft("<i>a</i>","1/<i>q</i>")})<sup><i>p</i></sup>`))}</div>\n    ${Ts("Exempel",`<p>${k(`${Ft(8,"1/3")} = 2`)}, eftersom ${k("2 · 2 · 2 = 8")}.</p><p>${k(`${Ft(27,"2/3")} = (${Ft(27,"1/3")})<sup>2</sup> = ${Ft(3,2)} = 9`)}</p><p>${k(`${Ft(16,"3/4")} = (${Ft(16,"1/4")})<sup>3</sup> = ${Ft(2,3)} = 8`)}</p>`)}\n    <h3>Skriv rötter som potenser</h3>\n    <p>Exponenten under roten hamnar i täljaren och roten i nämnaren: ${k(`${Ht(3,Ft(v,2))} = ${Ft(v,"2/3")}`)}. En rot i nämnaren ger negativ exponent: ${k(`${u(1,c(v))} = ${Ft(v,"−1/2")}`)}. Sedan gäller vanliga potenslagar: ${k(`${v} · ${c(v)} = ${Ft(v,"1 + 1/2")} = ${Ft(v,"3/2")}`)}.</p>\n    ${Bs("Dra roten först:",`då blir talen små. För ${k(Ft(27,"2/3"))} är tredje roten ur 27 lika med 3, och ${k(`${Ft(3,2)} = 9`)}. På räknaren skriver du exponenten inom parentes: <kbd>27^(2/3)</kbd>.`)}`,k1prefix:()=>`\n    <p>Ett <b>prefix</b> framför en enhet anger en tiopotens. 1 km = ${k(Ct(3))} m och 1 µm = ${k(Ct(-6))} m. Tabellen finns på formelbladet till nationella provet.</p>\n    <div class="tbl-wrap"><table class="cmp"><thead><tr><th>Prefix</th><th>Namn</th><th>Betyder</th></tr></thead><tbody>${En.map((([e,t,n])=>`<tr><td>${e}</td><td>${n}</td><td>${k(Ct(t))}</td></tr>`)).join("")}</tbody></table></div>\n    <h3>Byta enhet</h3>\n    <p>Jämför prefixens tiopotenser. Från km (${k(Ct(3))}) till mm (${k(Ct(-3))}) är skillnaden ${k(Ct(6))}, så 1 km = 1 000 000 mm. Går du till en mindre enhet blir talet större.</p>\n    <h3>Grundpotensform</h3>\n    <p>Stora och små tal skrivs ofta i grundpotensform. Exponenten säger hur många steg decimalkommat har flyttats.</p>\n    ${Es(k(`<i>a</i> · ${Ct("<i>n</i>")}, &nbsp; där 1 ≤ <i>a</i> &lt; 10 och <i>n</i> är ett heltal`))}\n    ${Ts("Exempel",`<p>${k(`45 000 000 = 4,5 · ${Ct(7)}`)}. Kommat flyttas 7 steg åt vänster.</p><p>${k(`0,00032 = 3,2 · ${Ct(-4)}`)}. Kommat flyttas 4 steg åt höger.</p><p>${k(`(3 · ${Ct(4)}) · (5 · ${Ct(6)}) = 15 · ${Ct(10)} = 1,5 · ${Ct(11)}`)}</p>`)}\n    ${Bs("Vanligt misstag:",`att svara ${k(`15 · ${Ct(10)}`)}. Det är rätt värde men inte grundpotensform, eftersom talet framför tiopotensen måste vara mindre än 10.`)}`,k1prio:()=>`\n    <p>När ett uttryck innehåller flera räknesätt räknar du i den här ordningen:</p>\n    <ol class="steps-list"><li>Parenteser</li><li>Potenser</li><li>Multiplikation och division, från vänster till höger</li><li>Addition och subtraktion, från vänster till höger</li></ol>\n    ${Ts("Exempel",`<p>${k("5 + 3 · 4 = 5 + 12 = 17")}</p><p>${k("(5 + 3) · 4 = 8 · 4 = 32")}</p><p>${k(`2 · ${Ft(3,2)} = 2 · 9 = 18`)}</p><p>${k("20 − 8 + 2 = 12 + 2 = 14")}</p>`)}\n    <h3>Bråkstreck</h3>\n    <p>Ett bråkstreck fungerar som en parentes runt täljaren och runt nämnaren: ${k(`${u("12 + 6","4 − 1")} = ${u(18,3)} = 6`)}. På räknaren skriver du <kbd>(12+6)/(4−1)</kbd>.</p>\n    <h3>Negativa tal och potenser</h3>\n    <div class="formula-row">${Es(k(`−${Ft(3,2)} = −(3 · 3) = −9`))}${Es(k(`${Ft("(−3)",2)} = (−3) · (−3) = 9`))}</div>\n    <p>En exponent hör bara till det som står närmast till vänster om den. Utan parentes kvadreras inte minustecknet.</p>\n    ${Bs("Vanligt misstag:","att räkna från vänster till höger direkt. 5 + 3 · 4 är 17, inte 32.")}`}),he.k1=()=>`\n  <div class="ov-grid">\n    <section class="card">\n      <h2>1.1 och 1.3 Bråk och räkneordning</h2>\n      <table class="ftable"><tbody>\n        ${_l("Talmängder","N naturliga, Z hela, Q rationella, R reella. Varje mängd ligger i nästa.")}\n        ${_l("Tecken",k("−(−<i>a</i>) = <i>a</i>")+". Lika tecken ger plus, olika ger minus.")}\n        ${_l("Addition",k(`${u("<i>a</i>","<i>c</i>")} + ${u("<i>b</i>","<i>c</i>")} = ${u("<i>a</i> + <i>b</i>","<i>c</i>")}`)+", gör liknämnigt först")}\n        ${_l("Multiplikation",k(`${u("<i>a</i>","<i>b</i>")} · ${u("<i>c</i>","<i>d</i>")} = ${u("<i>ac</i>","<i>bd</i>")}`))}\n        ${_l("Division",k(`${u(u("<i>a</i>","<i>b</i>"),u("<i>c</i>","<i>d</i>"))} = ${u("<i>a</i>","<i>b</i>")} · ${u("<i>d</i>","<i>c</i>")}`))}\n        ${_l("Blandad form",k(`${Lt(2,3,4)} = 2 + ${u(3,4)} = ${u(11,4)}`))}\n        ${_l("Procent",k(`1 % = 0,01 = ${u(1,100)}`))}\n        ${_l("Prioritering","Parenteser, potenser, multiplikation och division, addition och subtraktion")}\n        ${_l("Bråkstreck","Fungerar som parentes runt täljare och nämnare")}\n      </tbody></table>\n    </section>\n    <section class="card">\n      <h2>1.2 Potenser</h2>\n      <table class="ftable"><tbody>\n        ${_l("Multiplikation",k(`${Ft("<i>a</i>","<i>x</i>")} · ${Ft("<i>a</i>","<i>y</i>")} = ${Ft("<i>a</i>","<i>x</i> + <i>y</i>")}`))}\n        ${_l("Division",k(`${u(Ft("<i>a</i>","<i>x</i>"),Ft("<i>a</i>","<i>y</i>"))} = ${Ft("<i>a</i>","<i>x</i> − <i>y</i>")}`))}\n        ${_l("Potens av potens",k(`(${Ft("<i>a</i>","<i>x</i>")})<sup><i>y</i></sup> = ${Ft("<i>a</i>","<i>xy</i>")}`))}\n        ${_l("Produkt med samma exponent",k(`${Ft("<i>a</i>","<i>x</i>")} · ${Ft("<i>b</i>","<i>x</i>")} = (<i>ab</i>)<sup><i>x</i></sup>`))}\n        ${_l("Kvot med samma exponent",k(`${u(Ft("<i>a</i>","<i>x</i>"),Ft("<i>b</i>","<i>x</i>"))} = (${u("<i>a</i>","<i>b</i>")})<sup><i>x</i></sup>`))}\n        ${_l("Exponenten noll",k(`${Ft("<i>a</i>",0)} = 1`))}\n        ${_l("Negativ exponent",k(`${Ft("<i>a</i>","−<i>x</i>")} = ${u(1,Ft("<i>a</i>","<i>x</i>"))}`))}\n        ${_l("Rot som potens",k(`${Ft("<i>a</i>","1/<i>n</i>")} = ${Ht("<i>n</i>","<i>a</i>")}`))}\n        ${_l("Rationell exponent",k(`${Ft("<i>a</i>","<i>p</i>/<i>q</i>")} = (${Ft("<i>a</i>","1/<i>q</i>")})<sup><i>p</i></sup>`))}\n        ${_l("Grundpotensform",k(`<i>a</i> · ${Ct("<i>n</i>")}`)+", där "+k("1 ≤ <i>a</i> &lt; 10"))}\n      </tbody></table>\n      <h3>1.3 Prefix</h3>\n      <table class="ftable"><tbody>\n        ${En.map((([e,t,n])=>_l(`${e} &nbsp;${n}`,k(Ct(t))))).join("")}\n      </tbody></table>\n    </section>\n  </div>\n  <section class="card">\n    <h2>Vanliga misstag</h2>\n    <ul class="mistakes">\n      <li><b>Nämnarna adderas.</b> ${k(`${u(1,2)} + ${u(1,3)}`)} är ${k(u(5,6))}, inte ${k(u(2,5))}. Gör liknämnigt först.</li>\n      <li><b>Heltal gånger bråk.</b> Multiplicera bara täljaren: ${k(`3 · ${u(2,7)} = ${u(6,7)}`)}.</li>\n      <li><b>Fel bråk vänds vid division.</b> Det är bråket du delar med som ska vändas.</li>\n      <li><b>Exponenterna multipliceras vid multiplikation.</b> ${k(`${Ft(2,3)} · ${Ft(2,4)} = ${Ft(2,7)}`)}, inte ${k(Ft(2,12))}.</li>\n      <li><b>Negativ exponent ger negativt tal.</b> Nej, ${k(`${Ft(2,-3)} = ${u(1,8)}`)}.</li>\n      <li><b>−3² och (−3)² blandas ihop.</b> ${k(`−${Ft(3,2)} = −9`)} men ${k(`${Ft("(−3)",2)} = 9`)}.</li>\n      <li><b>Vänster till höger direkt.</b> Multiplikation före addition: 5 + 3 · 4 = 17.</li>\n      <li><b>Inte grundpotensform.</b> ${k(`15 · ${Ct(10)}`)} ska skrivas ${k(`1,5 · ${Ct(11)}`)}.</li>\n    </ul>\n  </section>`,Object.assign(Ss,{k2teckna:()=>`\n    <p>Ett <b>algebraiskt uttryck</b> innehåller bokstäver, variabler, som står för tal. Att <b>teckna</b> ett uttryck är att översätta en situation till matematik.</p>\n    <ul class="terms">\n      <li>${k("3<i>x</i>")} betyder ${k("3 · <i>x</i>")}.</li>\n      <li>${k(u("<i>x</i>",4))} betyder <i>x</i> delat med 4.</li>\n      <li>${k("<i>x</i>²")} betyder ${k("<i>x</i> · <i>x</i>")}.</li>\n    </ul>\n    ${Ts("Exempel: teckna",`<p>En biljett kostar <i>x</i> kr. Fyra biljetter och ett program för 30 kr kostar ${k("4<i>x</i> + 30")} kr.</p><p>Betalar man med en 500-lapp får man tillbaka ${k("500 − (4<i>x</i> + 30)")} kr.</p>`)}\n    <h3>Värdet av ett uttryck</h3>\n    <p>Byt ut variabeln mot talet. Sätt parentes runt negativa tal. Räkna sedan i rätt ordning:</p>\n    <ol class="steps-list"><li>Parenteser</li><li>Potenser</li><li>Multiplikation och division</li><li>Addition och subtraktion</li></ol>\n    ${Ts("Exempel: beräkna",`<p>${k("3<i>x</i>² − 2<i>x</i>")} för ${k("<i>x</i> = −2")}:</p><p>${k("3 · (−2)² − 2 · (−2) = 3 · 4 + 4 = 16")}</p>`)}\n    ${Bs("Vanligt misstag:","(−2)² och −2² är olika. (−2)² = 4, men −2² = −(2 · 2) = −4.")}`,k2forenkla:()=>`\n    <p>Termer av samma sort kan slås ihop: x-termer med x-termer och tal med tal. Tecknet framför en term hör till termen.</p>\n    ${Es(k("5<i>x</i> + 3 − 2<i>x</i> + 7 = 3<i>x</i> + 10"))}\n    <p>x²-termer och x-termer är olika sorter och kan inte slås ihop. ${k("4<i>x</i>² + 3<i>x</i>")} går inte att förenkla.</p>\n    <h3>Ta bort parenteser</h3>\n    <ul class="terms">\n      <li><b>Plus</b> framför parentesen: ta bara bort parentesen.</li>\n      <li><b>Minus</b> framför parentesen: ta bort parentesen och byt tecken på <b>alla</b> termer inuti.</li>\n    </ul>\n    <div class="formula-row">${Es(k("<i>a</i> + (<i>b</i> − <i>c</i>) = <i>a</i> + <i>b</i> − <i>c</i>"))}${Es(k("<i>a</i> − (<i>b</i> − <i>c</i>) = <i>a</i> − <i>b</i> + <i>c</i>"))}</div>\n    ${Ts("Exempel",`<p>${k("7<i>x</i> − (3<i>x</i> − 5) = 7<i>x</i> − 3<i>x</i> + 5 = 4<i>x</i> + 5")}</p>`)}\n    ${Bs("Vanligt misstag:","att bara byta tecken på den första termen i parentesen. Minustecknet gäller hela parentesen.")}`,k2parentes:()=>`\n    <p>När ett tal står framför en parentes multiplicerar du in det i <b>varje</b> term i parentesen.</p>\n    ${Es(k("<i>a</i>(<i>b</i> + <i>c</i>) = <i>ab</i> + <i>ac</i>"))}\n    ${Ts("Exempel 1",`<p>${k("−3(2<i>x</i> − 4) = −6<i>x</i> + 12")}</p><p>Minustecknet följer med: ${k("−3 · (−4) = 12")}.</p>`)}\n    <h3>Två parenteser</h3>\n    <p>Multiplicera varje term i den första parentesen med varje term i den andra. Det blir fyra produkter.</p>\n    ${Es(k("(<i>a</i> + <i>b</i>)(<i>c</i> + <i>d</i>) = <i>ac</i> + <i>ad</i> + <i>bc</i> + <i>bd</i>"))}\n    <div class="fig sm">${(()=>{const e=(e,t,n,a)=>`<rect class="tri-fill" x="${e}" y="${t}" width="${n}" height="${a}"/><rect class="tri-line" x="${e}" y="${t}" width="${n}" height="${a}"/>`;return`<svg viewBox="0 0 250 200" role="img" aria-label="Rektangel med sidorna x + 3 och x + 2 uppdelad i fyra delar">${e(40,22,120,120)}${e(160,22,54,120)}${e(40,142,120,36)}${e(160,142,54,36)}${E([100,11],$a("<i>x</i>"),"lbl")}${E([187,11],"3","lbl")}${E([28,82],$a("<i>x</i>"),"lbl","end")}${E([28,160],"2","lbl","end")}${E([100,82],$a("<i>x</i>²"),"lbl")}${E([187,82],$a("3<i>x</i>"),"lbl")}${E([100,160],$a("2<i>x</i>"),"lbl")}${E([187,160],"6","lbl")}</svg>`})()}</div>\n    <p class="caption">Arean av rektangeln är ${k("(<i>x</i> + 3)(<i>x</i> + 2)")}. De fyra delarna ger ${k("<i>x</i>² + 2<i>x</i> + 3<i>x</i> + 6 = <i>x</i>² + 5<i>x</i> + 6")}.</p>\n    ${Ts("Exempel 2",`<p>${k("(<i>x</i> + 3)(<i>x</i> − 5) = <i>x</i>² − 5<i>x</i> + 3<i>x</i> − 15 = <i>x</i>² − 2<i>x</i> − 15")}</p>`)}\n    ${Bs("Vanligt misstag:","(x + 3)² är inte x² + 9. Skriv (x + 3)(x + 3) = x² + 3x + 3x + 9 = x² + 6x + 9.")}`,k2faktor:()=>`\n    <p>Att <b>faktorisera</b> är motsatsen till att multiplicera in. Du skriver uttrycket som en produkt genom att <b>bryta ut</b> en faktor som finns i alla termer.</p>\n    ${Es(k("<i>ab</i> + <i>ac</i> = <i>a</i>(<i>b</i> + <i>c</i>)"))}\n    <ol class="steps-list"><li>Hitta det största tal som alla koefficienter är delbara med.</li><li>Finns x i alla termer? Bryt i så fall ut x också.</li><li>Dela varje term med faktorn och skriv resultatet i parentesen.</li><li>Kontrollera genom att multiplicera in igen.</li></ol>\n    ${Ts("Exempel 1",`<p>${k("6<i>x</i> + 9 = 3 · 2<i>x</i> + 3 · 3 = 3(2<i>x</i> + 3)")}</p>`)}\n    ${Ts("Exempel 2",`<p>${k("4<i>x</i>² + 10<i>x</i> = 2<i>x</i> · 2<i>x</i> + 2<i>x</i> · 5 = 2<i>x</i>(2<i>x</i> + 5)")}</p>`)}\n    ${Bs("Så långt som möjligt:","12x + 18 = 2(6x + 9) stämmer, men 6x och 9 har fortfarande den gemensamma faktorn 3. Fullständigt faktoriserat är 6(2x + 3).")}`,k2ekv1:()=>`\n    <p>En <b>ekvation</b> är en likhet med en okänd variabel. Att lösa ekvationen är att hitta det värde som gör vänsterledet (VL) och högerledet (HL) lika stora.</p>\n    <p>Tänk dig en våg i balans. Gör du samma sak med båda leden är vågen fortfarande i balans. Använd motsatt räknesätt för att få x ensamt.</p>\n    ${Ts("Exempel 1",`<p>${k("3<i>x</i> + 5 = 20")}</p><p>Subtrahera 5 från båda leden: ${k("3<i>x</i> = 15")}</p><p>Dela båda leden med 3: ${k("<i>x</i> = 5")}</p>`)}\n    ${Ts("Exempel 2",`<p>${k(`${u("<i>x</i>",4)} = 7`)}</p><p>Multiplicera båda leden med 4: ${k("<i>x</i> = 28")}</p>`)}\n    <h3>Pröva svaret</h3>\n    <p>Sätt in lösningen i ekvationen. I exempel 1 blir VL = ${k("3 · 5 + 5 = 20")}, vilket är lika med HL. Svaret stämmer.</p>\n    ${Bs("Motsatt räknesätt:","plus tar du bort med minus, och gånger tar du bort med division. Gör det alltid med båda leden.")}`,k2ekv2:()=>`\n    <p>Står x på båda sidor samlar du alla x-termer på ena sidan och alla tal på den andra. Välj gärna den sida där x-termerna blir positiva.</p>\n    ${Ts("Exempel 1",`<p>${k("5<i>x</i> − 3 = 2<i>x</i> + 9")}</p><p>Subtrahera ${k("2<i>x</i>")}: ${k("3<i>x</i> − 3 = 9")}</p><p>Addera 3: ${k("3<i>x</i> = 12")}, alltså ${k("<i>x</i> = 4")}</p>`)}\n    <h3>Ekvationer med parenteser</h3>\n    <p>Multiplicera först in i parenteserna. Lös sedan ekvationen som vanligt.</p>\n    ${Ts("Exempel 2",`<p>${k("3(<i>x</i> − 2) = <i>x</i> + 8")}</p><p>${k("3<i>x</i> − 6 = <i>x</i> + 8")}</p><p>${k("2<i>x</i> = 14")}, alltså ${k("<i>x</i> = 7")}</p>`)}\n    ${Bs("Varför byter termen tecken?",'När 2x "flyttas" till andra sidan subtraherar du egentligen 2x från båda leden. Det är därför tecknet byts.')}`,k2ekvnamn:()=>`\n    <p>När en ekvation har nämnare multiplicerar du alla termer, i båda leden, med <b>minsta gemensamma nämnaren</b> (MGN). Då försvinner bråken.</p>\n    ${Ts("Exempel 1",`<p>${k(`${u("<i>x</i>",3)} + ${u("<i>x</i>",4)} = 7`)}</p><p>MGN är 12. Multiplicera alla termer med 12: ${k("4<i>x</i> + 3<i>x</i> = 84")}</p><p>${k("7<i>x</i> = 84")}, alltså ${k("<i>x</i> = 12")}</p>`)}\n    ${Ts("Exempel 2",`<p>${k(`${u("<i>x</i> + 2",5)} = 3`)}</p><p>Multiplicera med 5: ${k("<i>x</i> + 2 = 15")}, alltså ${k("<i>x</i> = 13")}</p>`)}\n    <h3>x i nämnaren</h3>\n    ${Ts("Exempel 3",`<p>${k(`${u(12,"<i>x</i>")} = 4`)}</p><p>Multiplicera båda leden med x: ${k("12 = 4<i>x</i>")}, alltså ${k("<i>x</i> = 3")}</p>`)}\n    ${Bs("Bråkstrecket är en parentes:","i (x + 2)/5 delas hela täljaren x + 2 med 5, inte bara 2.")}`,k2ekvprob:()=>`\n    <p>Många problem kan lösas med en ekvation. Arbeta steg för steg:</p>\n    <ol class="steps-list"><li>Bestäm vad x står för. Skriv det.</li><li>Teckna de andra storheterna med hjälp av x.</li><li>Ställ upp en ekvation utifrån texten.</li><li>Lös ekvationen.</li><li>Svara på frågan och kontrollera att svaret är rimligt.</li></ol>\n    ${Ts("Exempel",`<p>Summan av tre heltal som följer direkt på varandra är 72. Vilka är talen?</p><p>Låt det minsta talet vara x. Talen är x, x + 1 och x + 2.</p><p>${k("<i>x</i> + (<i>x</i> + 1) + (<i>x</i> + 2) = 72")}</p><p>${k("3<i>x</i> + 3 = 72")}, alltså ${k("<i>x</i> = 23")}. Talen är 23, 24 och 25.</p>`)}\n    ${Ts("Exempel: pris",`<p>En tröja kostar 100 kr mer än en mössa. 2 tröjor och 3 mössor kostar 1 200 kr. Låt x vara mössans pris.</p><p>${k("2(<i>x</i> + 100) + 3<i>x</i> = 1 200")}</p><p>${k("5<i>x</i> + 200 = 1 200")}, alltså ${k("<i>x</i> = 200")}. En mössa kostar 200 kr.</p>`)}\n    ${Bs("Svara på rätt fråga:","x är ofta bara en del av svaret. Läs frågan igen innan du svarar.")}`,k2potekv:()=>`\n    <p>Ekvationen ${k("<i>x</i>² = 49")} har två lösningar, eftersom både ${k("7² = 49")} och ${k("(−7)² = 49")}.</p>\n    ${Es(k(`<i>x</i>² = <i>a</i> &nbsp;ger&nbsp; <i>x</i> = ±${c("<i>a</i>")}`)+" &nbsp;om a &gt; 0")}\n    <ul class="terms">\n      <li>a &gt; 0: två lösningar</li>\n      <li>a = 0: en lösning, x = 0</li>\n      <li>a &lt; 0: ingen lösning, eftersom ett tal i kvadrat aldrig är negativt</li>\n    </ul>\n    <h3>Tredjegradsekvationer</h3>\n    <p>${k("<i>x</i>³ = −8")} har bara en lösning, ${k("<i>x</i> = −2")}, eftersom ${k("(−2)³ = −8")}. Med exponenten 3 får lösningen samma tecken som högerledet.</p>\n    ${Ts("Exempel 1",`<p>${k("3<i>x</i>² = 75")}</p><p>Dela med 3: ${k("<i>x</i>² = 25")}</p><p>${k("<i>x</i> = ±5")}</p>`)}\n    ${Ts("Exempel 2",`<p>${k("<i>x</i>³ + 10 = −17")}</p><p>Subtrahera 10: ${k("<i>x</i>³ = −27")}</p><p>${k("<i>x</i> = −3")}</p>`)}\n    ${Bs("Vanligt misstag:","att glömma den negativa lösningen till x² = 49. Svaret är x = 7 och x = −7.")}`,k2potekv2:()=>`\n    <p>En <b>potensekvation</b> har formen ${k("<i>x</i><sup><i>n</i></sup> = <i>a</i>")}. Du löser den genom att upphöja båda leden till ${k(u(1,"<i>n</i>"))}.</p>\n    ${Es(k("<i>x</i><sup><i>n</i></sup> = <i>a</i> &nbsp;ger&nbsp; <i>x</i> = <i>a</i><sup>1/<i>n</i></sup>"))}\n    ${Ts("Exempel 1",`<p>${k("<i>x</i><sup>5</sup> = 200")}</p><p>${k("<i>x</i> = 200<sup>1/5</sup> ≈ 2,89")}</p><p>På räknaren: 200 ^ (1 / 5).</p>`)}\n    <p>Är exponenten jämn finns också en negativ lösning. ${k("<i>x</i><sup>4</sup> = 81")} ger ${k("<i>x</i> = ±3")}.</p>\n    <h3>Procent per år</h3>\n    ${Ts("Exempel 2",`<p>Ett belopp växer från 20 000 kr till 30 000 kr på 6 år. Hur många procent per år?</p><p>${k("20 000 · <i>x</i><sup>6</sup> = 30 000")}, alltså ${k("<i>x</i><sup>6</sup> = 1,5")}</p><p>${k("<i>x</i> = 1,5<sup>1/6</sup> ≈ 1,070")}. Ökningen är ungefär 7,0 % per år.</p>`)}\n    ${Bs("Räknaren:","skriv parentes runt 1/5. Utan parentes räknar räknaren 200¹ / 5 = 40, vilket blir fel.")}`,k2olikhet:()=>`\n    <p>En <b>olikhet</b> löses nästan som en ekvation. Lösningen är inte ett enda tal, utan alla tal på ena sidan om ett gränsvärde.</p>\n    <ul class="terms">\n      <li>${k("<i>x</i> &lt; 4")}: x är mindre än 4</li>\n      <li>${k("<i>x</i> &gt; 4")}: x är större än 4</li>\n      <li>${k("<i>x</i> ≤ 4")}: x är mindre än eller lika med 4</li>\n      <li>${k("<i>x</i> ≥ 4")}: x är större än eller lika med 4</li>\n    </ul>\n    ${Es("Multiplicerar eller dividerar du båda leden med ett <b>negativt</b> tal måste olikhetstecknet <b>vändas</b>.")}\n    ${Ts("Exempel 1",`<p>${k("3<i>x</i> − 4 &gt; 8")}</p><p>${k("3<i>x</i> &gt; 12")}, alltså ${k("<i>x</i> &gt; 4")}</p>`)}\n    <div class="fig">${(()=>{const e=e=>20+34*e;let t='<line class="g-axis" x1="8" y1="30" x2="312" y2="30"/>';for(let n=0;n<=8;n++)t+=`<line class="g-axis" x1="${e(n)}" y1="25" x2="${e(n)}" y2="35"/>`+E([e(n),48],String(n),"g-num");return t+=`<line class="seg-main" x1="${e(4)}" y1="30" x2="300" y2="30" style="stroke-width:4"/><polygon points="312,30 300,24 300,36" style="fill:var(--accent)"/>`,t+=`<circle cx="${e(4)}" cy="30" r="6" style="fill:var(--sheet);stroke:var(--accent);stroke-width:2.4"/>`,`<svg viewBox="0 0 320 58" role="img" aria-label="Tallinje där alla tal större än 4 är markerade">${t}</svg>`})()}</div>\n    <p class="caption">${k("<i>x</i> &gt; 4")}: den öppna ringen visar att 4 inte ingår.</p>\n    ${Ts("Exempel 2",`<p>${k("−2<i>x</i> &lt; 6")}</p><p>Dela med −2 och vänd tecknet: ${k("<i>x</i> &gt; −3")}</p>`)}\n    ${Bs("Pröva:","sätt in ett tal ur lösningen. x = 0 i −2x &lt; 6 ger 0 &lt; 6, vilket stämmer.")}`,k2formel:()=>`\n    <p>En <b>formel</b> beskriver ett samband mellan storheter. Du använder den genom att sätta in de värden du känner till.</p>\n    ${Ts("Exempel 1",`<p>${k("<i>F</i> = 1,8<i>C</i> + 32")} räknar om grader Celsius till grader Fahrenheit.</p><p>20 °C: ${k("<i>F</i> = 1,8 · 20 + 32 = 68")} °F</p>`)}\n    <h3>Lösa ut en variabel</h3>\n    <p>Behandla formeln som en ekvation, där den sökta bokstaven är x.</p>\n    ${Ts("Exempel 2",`<p>Lös ut h ur ${k(`<i>A</i> = ${u("<i>bh</i>",2)}`)}.</p><p>Multiplicera med 2: ${k("2<i>A</i> = <i>bh</i>")}</p><p>Dela med b: ${k(`<i>h</i> = ${u("2<i>A</i>","<i>b</i>")}`)}</p>`)}\n    <p>Om du bara ska räkna ut ett värde kan du också sätta in talen först och lösa ekvationen sedan.</p>\n    ${Bs("Enheter:","kontrollera att enheterna passar. I s = vt med farten i km/h ska tiden vara i timmar, inte minuter.")}`,k2kalkyl:()=>`\n    <p>I ett kalkylprogram, till exempel Excel eller Google Kalkylark, börjar en formel med <b>=</b>. Formeln räknar med innehållet i andra celler.</p>\n    <div class="tbl-wrap">${$r(["A","B","C"],[[1,"Antal","Pris/st","Summa"],[2,3,25,"=A2*B2"],[3,5,12,"=A3*B3"]])}</div>\n    <p class="caption">C2 visar 75 och C3 visar 60.</p>\n    <ul class="terms">\n      <li><b>*</b> betyder gånger, <b>/</b> delat med och <b>^</b> upphöjt till.</li>\n      <li>=SUMMA(B2:B6) ger summan av alla celler från B2 till B6.</li>\n      <li>Moms 25 %: =B2*1,25, eftersom priset blir 125 %.</li>\n    </ul>\n    <h3>Kopiera formler</h3>\n    <p>När du kopierar en formel nedåt ändras radnumren: =A2*B2 blir =A3*B3. Ska en cell inte ändras låser du den med dollartecken, till exempel =A3*$B$1.</p>\n    ${Ts("Exempel","<p>Timlönen står i B1. I B3 skrivs =A3*$B$1 och formeln kopieras nedåt. I B5 står då =A5*$B$1.</p>")}\n    ${Bs("Vanligt misstag:","att glömma $ när alla rader ska räkna med samma cell. Då pekar formeln på tomma celler längre ner.")}`,k2monster:()=>`\n    <p>I många mönster ökar antalet lika mycket för varje ny figur. Då kan antalet skrivas som ${k("<i>an</i> + <i>b</i>")}, där n är figurens nummer.</p>\n    <div class="fig">${cr("kvadrater")}</div>\n    <div class="tbl-wrap"><table class="mini"><tr><th>figur n</th><td>1</td><td>2</td><td>3</td><td>4</td></tr><tr><th>stickor</th><td>4</td><td>7</td><td>10</td><td>13</td></tr></table></div>\n    <ul class="terms">\n      <li><b>a</b> är ökningen per figur. Här ökar antalet med 3, så a = 3.</li>\n      <li><b>b</b> får du genom att tänka på figur 0: ${k("4 − 3 = 1")}, så b = 1.</li>\n    </ul>\n    ${Es(k("antal stickor = 3<i>n</i> + 1"))}\n    ${Ts("Exempel",`<p>Figur 20: ${k("3 · 20 + 1 = 61")} stickor.</p><p>Vilken figur har 151 stickor? ${k("3<i>n</i> + 1 = 151")} ger ${k("<i>n</i> = 50")}.</p>`)}\n    ${Bs("Kontrollera formeln:","sätt in n = 1 och n = 2 och jämför med figurerna.")}`,k2talfoljd:()=>`\n    <p>En <b>talföljd</b> är tal i en bestämd ordning: ${k(`${ua(1)}, ${ua(2)}, ${ua(3)}, …`)}. I en <b>aritmetisk</b> talföljd är skillnaden mellan två tal i följd alltid densamma. Skillnaden kallas <b>differensen</b> d.</p>\n    <div class="formula-row">${Es(k(`${ua("<i>n</i>")} = ${ua(1)} + (<i>n</i> − 1)<i>d</i>`))}${Es(k(`<i>s</i><sub><i>n</i></sub> = ${u(`<i>n</i>(${ua(1)} + ${ua("<i>n</i>")})`,2)}`))}</div>\n    <p>Den andra formeln ger summan av de n första talen.</p>\n    ${Ts("Exempel 1",`<p>5, 8, 11, 14, … har ${k(`${ua(1)} = 5`)} och ${k("<i>d</i> = 3")}.</p><p>${k(`${ua(20)} = 5 + 19 · 3 = 62`)}</p>`)}\n    ${Ts("Exempel 2",`<p>Summan av de 20 första talen: ${k(`<i>s</i><sub>20</sub> = ${u("20(5 + 62)",2)} = 670`)}</p>`)}\n    ${Bs("Vanligt misstag:","att räkna a₁ + n · d. Från a₁ till aₙ är det bara n − 1 steg.")}`}),he.k2=()=>`\n  <div class="ov-grid">\n    <section class="card">\n      <h2>2.1 och 2.2 Uttryck och ekvationer</h2>\n      <table class="ftable"><tbody>\n        ${_l("Minus före parentes",k("<i>a</i> − (<i>b</i> − <i>c</i>) = <i>a</i> − <i>b</i> + <i>c</i>"))}\n        ${_l("Multiplicera in",k("<i>a</i>(<i>b</i> + <i>c</i>) = <i>ab</i> + <i>ac</i>"))}\n        ${_l("Två parenteser",k("(<i>a</i> + <i>b</i>)(<i>c</i> + <i>d</i>) = <i>ac</i> + <i>ad</i> + <i>bc</i> + <i>bd</i>"))}\n        ${_l("Faktorisera",k("6<i>x</i> + 9 = 3(2<i>x</i> + 3)")+", bryt ut största gemensamma faktor")}\n        ${_l("Lösa ekvation","Gör samma sak med båda leden: först + och −, sedan · och /")}\n        ${_l("x på båda sidor","Samla x-termerna på ena sidan och talen på den andra")}\n        ${_l("Nämnare","Multiplicera alla termer med minsta gemensamma nämnaren")}\n        ${_l("Pröva","Sätt in svaret. VL och HL ska bli lika.")}\n      </tbody></table>\n    </section>\n    <section class="card">\n      <h2>2.3 och 2.4 Potenser, olikheter och formler</h2>\n      <table class="ftable"><tbody>\n        ${_l("Andragradsekvation",k(`<i>x</i>² = <i>a</i> ger <i>x</i> = ±${c("<i>a</i>")}`)+" om a &gt; 0")}\n        ${_l("Tredjegradsekvation",k("<i>x</i>³ = −8 ger <i>x</i> = −2")+", en lösning")}\n        ${_l("Potensekvation",k("<i>x</i><sup><i>n</i></sup> = <i>a</i> ger <i>x</i> = <i>a</i><sup>1/<i>n</i></sup>"))}\n        ${_l("Olikhet","Vänd tecknet när du multiplicerar eller dividerar med ett negativt tal")}\n        ${_l("Lösa ut en variabel","Behandla formeln som en ekvation")}\n        ${_l("Kalkylprogram","=A2*B2. $B$1 låser cellen när formeln kopieras.")}\n        ${_l("Mönster",k("<i>an</i> + <i>b</i>")+": a är ökningen per figur")}\n        ${_l("Aritmetisk talföljd",k(`${ua("<i>n</i>")} = ${ua(1)} + (<i>n</i> − 1)<i>d</i>`))}\n        ${_l("Summa",k(`<i>s</i><sub><i>n</i></sub> = ${u(`<i>n</i>(${ua(1)} + ${ua("<i>n</i>")})`,2)}`))}\n      </tbody></table>\n    </section>\n  </div>\n  <section class="card">\n    <h2>Vanliga misstag</h2>\n    <ul class="mistakes">\n      <li><b>Minus före parentes.</b> Alla termer i parentesen byter tecken, inte bara den första.</li>\n      <li><b>(x + 3)² = x² + 9.</b> Fel. Rätt är x² + 6x + 9, eftersom mittentermen kommer två gånger.</li>\n      <li><b>Termen byter inte tecken.</b> När en term flyttas till andra ledet byter den tecken.</li>\n      <li><b>Bara en term multipliceras.</b> Med MGN ska alla termer i båda leden multipliceras.</li>\n      <li><b>Glömd negativ lösning.</b> x² = 49 har lösningarna 7 och −7.</li>\n      <li><b>Olikhetstecknet vänds inte.</b> Delar du med −2 ska &lt; bli &gt;.</li>\n      <li><b>a₁ + n · d.</b> Det n:te talet är a₁ + (n − 1)d.</li>\n      <li><b>Minuter i stället för timmar.</b> Kontrollera enheterna innan du sätter in i en formel.</li>\n    </ul>\n  </section>`,Object.assign(Ss,{k3procent:()=>`\n    <p><b>Procent</b> betyder hundradelar: 1 % = ${u(1,100)} = 0,01. En <b>andel</b> kan skrivas i procent, som bråk eller som decimaltal, till exempel 25 % = ${u(1,4)} = 0,25.</p>\n    <p>Tre storheter hör ihop: <b>delen</b>, <b>det hela</b> och <b>andelen</b>. Känner du två av dem kan du räkna ut den tredje.</p>\n    <div class="formula-row">${Es(k(`andelen = ${u("delen","det hela")}`))}${Es(k("delen = andelen · det hela"))}${Es(k(`det hela = ${u("delen","andelen")}`))}</div>\n    ${Ts("Exempel 1: delen",`<p>Hur mycket är 18 % av 450 kr?</p><p>${k("0,18 · 450 = 81")} kr</p>`)}\n    ${Ts("Exempel 2: andelen",`<p>12 av 30 elever går teknikprogrammet. Hur stor andel är det?</p><p>${k(`${u(12,30)} = 0,4 = 40 %`)}</p>`)}\n    ${Ts("Exempel 3: det hela",`<p>63 elever är 35 % av alla elever på skolan. Hur många elever går på skolan?</p><p>${k(`${u(63,"0,35")} = 180`)} elever</p>`)}\n    <h3>Procent i huvudet</h3>\n    <ul class="terms">\n      <li><b>50 %</b> är hälften. Dela med 2.</li>\n      <li><b>25 %</b> är en fjärdedel. Dela med 4.</li>\n      <li><b>10 %</b> är en tiondel. Dela med 10. Då är 5 % hälften av det och 20 % dubbelt så mycket.</li>\n      <li><b>1 %</b> är en hundradel. Dela med 100.</li>\n    </ul>\n    <h3>Procentenheter</h3>\n    <p>När något som redan anges i procent ändras skiljer man på <b>procentenheter</b> och <b>procent</b>. Procentenheter är skillnaden mellan procentsatserna. Procent är skillnaden jämförd med det gamla värdet.</p>\n    ${Ts("Exempel 4: räntan höjs från 2 % till 3 %",`<p>Skillnaden är ${k("3 − 2 = 1")} procentenhet.</p><p>I procent: ${k(`${u(1,2)} = 0,5 = 50 %`)}. Räntan har alltså ökat med 50 %.</p>`)}\n    ${Bs("Vanligt misstag:","att säga att räntan har ökat med 1 % när den går från 2 % till 3 %. Den har ökat med 1 procentenhet, vilket är 50 %.")}`,k3promille:()=>`\n    <p>För mycket små andelar används <b>promille</b> (‰), som betyder tusendelar, och <b>ppm</b> (parts per million), som betyder miljondelar.</p>\n    <div class="tbl-wrap"><table class="cmp"><thead><tr><th>Enhet</th><th>Betyder</th><th>Decimaltal</th></tr></thead><tbody>\n      <tr><td>1 %</td><td>en hundradel</td><td>0,01</td></tr>\n      <tr><td>1 ‰</td><td>en tusendel</td><td>0,001</td></tr>\n      <tr><td>1 ppm</td><td>en miljondel</td><td>0,000001</td></tr>\n    </tbody></table></div>\n    ${Es(k("1 % = 10 ‰ = 10 000 ppm")+" &nbsp; och &nbsp; "+k("1 ‰ = 1 000 ppm"))}\n    <p>Du räknar på samma sätt som med procent: ${k("delen = andelen · det hela")}. Skriv bara andelen som decimaltal först, och räkna med samma enhet i delen och det hela.</p>\n    ${Ts("Exempel 1: alkohol i blodet",`<p>En person har 5 kg blod och 0,4 ‰ alkohol i blodet. Hur många gram alkohol är det?</p><p>0,4 ‰ = 0,0004 och 5 kg = 5 000 g, så ${k("0,0004 · 5 000 = 2")} g.</p>`)}\n    ${Ts("Exempel 2: koldioxid i luften",`<p>Utomhusluft innehåller ungefär 420 ppm koldioxid. Hur mycket koldioxid finns i 1 000 liter luft?</p><p>420 ppm = 0,00042, så ${k("0,00042 · 1 000 = 0,42")} liter.</p>`)}\n    ${Ts("Exempel 3: halten",`<p>I 4 kg havsvatten finns 140 g salt. Hur stor är salthalten?</p><p>${k(`${u(140,"4 000")} = 0,035 = 35 ‰`)}</p>`)}\n    ${Bs("Vanligt misstag:","att dela med 100 när det står promille. Promille är tusendelar, så 4 ‰ = 0,004.")}`,k3faktor:()=>`\n    <p>När ett värde ändras med en viss procent kan du räkna ut det nya värdet i ett enda steg. Du multiplicerar med <b>förändringsfaktorn</b>.</p>\n    ${Es(k("nytt värde = gammalt värde · förändringsfaktor"))}\n    <ul class="terms">\n      <li><b>Ökning med 12 %:</b> 100 % + 12 % = 112 %, så förändringsfaktorn är 1,12.</li>\n      <li><b>Minskning med 12 %:</b> 100 % − 12 % = 88 %, så förändringsfaktorn är 0,88.</li>\n    </ul>\n    <p>En förändringsfaktor större än 1 betyder ökning. En förändringsfaktor mellan 0 och 1 betyder minskning.</p>\n    ${Ts("Exempel 1: nytt värde",`<p>En jacka kostar 800 kr och sänks med 30 %.</p><p>${k("800 · 0,70 = 560")} kr</p>`)}\n    <h3>Tillbaka till ursprungsvärdet</h3>\n    <p>Om du vet det nya värdet delar du med förändringsfaktorn.</p>\n    ${Es(k(`gammalt värde = ${u("nytt värde","förändringsfaktor")}`))}\n    ${Ts("Exempel 2: ursprungligt pris",`<p>Efter en prishöjning på 25 % kostar en vara 500 kr. Vad kostade den innan?</p><p>${k(`${u(500,"1,25")} = 400`)} kr. Kontroll: ${k("400 · 1,25 = 500")}.</p>`)}\n    <h3>Procentuell förändring</h3>\n    ${Es(k(`förändringsfaktor = ${u("nytt värde","gammalt värde")}`))}\n    ${Ts("Exempel 3: hur många procent?",`<p>Priset ändras från 250 kr till 290 kr.</p><p>${k(`${u(290,250)} = 1,16`)}, alltså en ökning med 16 %.</p><p>Från 250 kr till 210 kr: ${k(`${u(210,250)} = 0,84`)}, alltså en minskning med 16 %.</p>`)}\n    ${Bs("Vanligt misstag:","att dra av 25 % från 500 kr för att komma tillbaka. Det ger 375 kr, men rätt svar är 400 kr. Höjningen räknades på det gamla priset, så du måste dela med 1,25.")}`,k3upprepad:()=>`\n    <p>Vid flera procentuella förändringar i rad multiplicerar du med förändringsfaktorerna efter varandra. Varje ny förändring räknas på det värde som gäller just då.</p>\n    ${Es(k("nytt värde = gammalt värde · <i>a</i><sub>1</sub> · <i>a</i><sub>2</sub> · <i>a</i><sub>3</sub> · …"))}\n    ${Ts("Exempel 1: först upp, sedan ner",`<p>Ett pris på 500 kr höjs med 20 % och sänks sedan med 20 %.</p><p>${k("500 · 1,20 · 0,80 = 480")} kr</p><p>Den totala förändringsfaktorn är ${k("1,2 · 0,8 = 0,96")}, alltså en minskning med 4 %. Förändringarna tar inte ut varandra.</p>`)}\n    <h3>Samma förändring flera gånger</h3>\n    <p>Om värdet ändras med samma procent <i>n</i> gånger blir den totala förändringsfaktorn ${k("<i>a</i><sup><i>n</i></sup>")}.</p>\n    ${Es(k("nytt värde = gammalt värde · <i>a</i><sup><i>n</i></sup>"))}\n    ${Ts("Exempel 2: 5 % per år i 6 år",`<p>${k("1,05<sup>6</sup> ≈ 1,340")}, alltså en total ökning med ungefär 34,0 %. Det är mer än ${k("6 · 5 = 30")} %, eftersom varje ökning räknas på ett större värde.</p>`)}\n    <h3>Genomsnittlig förändring per år</h3>\n    <p>Om du vet start, slut och antal år kallar du förändringsfaktorn per år för <i>x</i>. Lös ekvationen med <i>n</i>:te roten. På räknaren skriver du ^(1/<i>n</i>).</p>\n    ${Ts("Exempel 3: ett hus ökar i värde",`<p>Ett hus ökade i värde från 2 000 000 kr till 2 600 000 kr på 5 år.</p><p>${k(`<i>x</i><sup>5</sup> = ${u("2 600 000","2 000 000")} = 1,3`)}</p><p>${k("<i>x</i> = 1,3<sup>1/5</sup> ≈ 1,054")}, alltså en ökning med ungefär 5,4 % per år.</p>`)}\n    ${Bs("Vanligt misstag:","att tro att +20 % och −20 % tar ut varandra, eller att 5 % per år i 6 år blir 30 %. Multiplicera alltid förändringsfaktorerna.")}`,k3index:()=>`\n    <p>Ett <b>index</b> visar hur något förändras jämfört med ett <b>basår</b>. Basåret har index 100. Index 112 betyder att priset är 112 % av priset basåret, alltså 12 % högre.</p>\n    <h3>Konsumentprisindex, KPI</h3>\n    <p><b>KPI</b> mäter hur priserna på varor och tjänster i Sverige förändras. Basåret för KPI är 1980. Med KPI kan du räkna om ett pris eller en lön till ett annat års penningvärde.</p>\n    <div class="fig">${Rr([1980,1990,2e3,2010,2020])}</div>\n    <p class="caption">KPI för några år, avrundade värden.</p>\n    ${Es(k(`${u("pris år 2","pris år 1")} = ${u("KPI år 2","KPI år 1")}`))}\n    ${Ts("Exempel 1: räkna om ett pris",`<p>En biobiljett kostade 55 kr år 1990. Vad motsvarar det i 2020 års penningvärde?</p><p>${k(`55 · ${u(336,208)} ≈ 89`)} kr</p>`)}\n    <h3>Procentuell förändring av ett index</h3>\n    <p>Räkna med kvoten mellan indextalen, inte med skillnaden. Från index 120 till 132: ${k(`${u(132,120)} = 1,10`)}, alltså en ökning med 10 %, inte 12 %.</p>\n    <h3>Reallön</h3>\n    <p><b>Reallönen</b> visar vad lönen räcker till. Räkna om den gamla lönen med KPI och jämför. Har lönen ökat mindre än priserna har reallönen minskat, fast lönen i kronor har ökat.</p>\n    ${Ts("Exempel 2: reallön",`<p>Lönen var 24 000 kr år 2010 och 26 000 kr år 2020.</p><p>${k(`24 000 · ${u(336,303)} ≈ 26 614`)} kr. Lönen 26 000 kr är mindre än så, så reallönen har minskat.</p>`)}\n    ${Bs("Vanligt misstag:","att tolka skillnaden mellan två indextal som procent. Det stämmer bara när det första indextalet är 100.")}`,k3spara:()=>`\n    <p>På ett sparkonto får du <b>ränta</b>. Räntan läggs till kapitalet, och året efter får du ränta även på den räntan. Det kallas <b>ränta på ränta</b>.</p>\n    ${Es(k("<i>K</i> · (1 + <i>r</i>)<sup><i>n</i></sup>"))}\n    <p class="caption"><i>K</i> är startkapitalet, <i>r</i> räntesatsen som decimaltal och <i>n</i> antalet år.</p>\n    ${Ts("Exempel 1: ränta på ränta",`<p>Du sätter in 10 000 kr med 3 % ränta per år i 8 år.</p><p>${k("10 000 · 1,03<sup>8</sup> ≈ 12 668")} kr. Räntan är totalt ${k("12 668 − 10 000 = 2 668")} kr.</p>`)}\n    <h3>Hur lång tid? Vilken ränta?</h3>\n    <p>Söker du tiden kan du pröva dig fram på räknaren. Söker du räntesatsen löser du ${k(`<i>x</i><sup><i>n</i></sup> = ${u("slutbelopp","startbelopp")}`)} med <i>n</i>:te roten.</p>\n    ${Ts("Exempel 2: hur lång tid?",`<p>Hur många år tar det innan 10 000 kr har blivit minst 15 000 kr med 4 % ränta?</p><p>${k("1,04<sup>10</sup> ≈ 1,480")} räcker inte, men ${k("1,04<sup>11</sup> ≈ 1,539")} gör det. Det tar 11 år.</p>`)}\n    <h3>I ett kalkylprogram</h3>\n    <div class="fig">${Nr([["År","Saldo"],["0","10000"],["1","=B2*1,03"],["2","=B3*1,03"],["3","=B4*1,03"]])}</div>\n    <p>Skriv startbeloppet i B2 och formeln =B2*1,03 i B3. När du kopierar formeln nedåt ändras cellreferensen automatiskt, så varje rad räknar ett år till. Sätter du in pengar varje år lägger du till dem i formeln, till exempel =B2*1,03+500.</p>\n    ${Bs("Vanligt misstag:","att räkna 3 % av startbeloppet varje år, alltså 10 000 + 8 · 300. Då missar du ränta på ränta.")}`,k3lan:()=>`\n    <p>När du lånar pengar betalar du <b>ränta</b> till banken. Du <b>amorterar</b> också, det vill säga betalar tillbaka en del av skulden. Räntan räknas på den skuld som är kvar.</p>\n    <div class="formula-row">${Es(k("ränta = skuld · räntesats"))}${Es(k(`månadsränta = ${u("årsränta",12)}`))}</div>\n    ${Ts("Exempel 1: ränta för en månad",`<p>Ett lån på 120 000 kr har årsräntan 4,8 %.</p><p>Räntan för ett år: ${k("120 000 · 0,048 = 5 760")} kr. För en månad: ${k(`${u("5 760",12)} = 480`)} kr.</p>`)}\n    <h3>Rak amortering</h3>\n    <p>Vid <b>rak amortering</b> betalar du tillbaka lika mycket av skulden varje gång. Skulden minskar, och därför blir räntan mindre för varje betalning.</p>\n    ${Ts("Exempel 2: rak amortering",`<p>Du lånar 60 000 kr och betalar tillbaka på 3 år, en gång per år. Räntan är 6 % per år. Amorteringen blir ${k(`${u("60 000",3)} = 20 000`)} kr varje år.</p>`)}\n    <div class="tbl-wrap"><table class="cmp"><thead><tr><th>År</th><th>Skuld före</th><th>Ränta</th><th>Att betala</th></tr></thead><tbody>\n      <tr><td>1</td><td>60 000</td><td>3 600</td><td>23 600</td></tr>\n      <tr><td>2</td><td>40 000</td><td>2 400</td><td>22 400</td></tr>\n      <tr><td>3</td><td>20 000</td><td>1 200</td><td>21 200</td></tr>\n    </tbody></table></div>\n    <p class="caption">Att betala = amortering 20 000 kr + ränta. Räntan blir totalt ${k("3 600 + 2 400 + 1 200 = 7 200")} kr.</p>\n    <p>Ett annat sätt att betala av ett lån är <b>annuitetslån</b>. Där är hela betalningen, amortering plus ränta, lika stor varje gång.</p>\n    ${Bs("Vanligt misstag:","att räkna räntan på hela lånebeloppet varje gång. Räntan räknas bara på det du fortfarande är skyldig. Och glöm inte att dela årsräntan med 12 när du räknar per månad.")}`}),he.k3=()=>`\n  <div class="ov-grid">\n    <section class="card">\n      <h2>3.1 Procentuella förändringar</h2>\n      <table class="ftable"><tbody>\n        ${_l("Procent",k(`1 % = ${u(1,100)} = 0,01`))}\n        ${_l("Delen",k("delen = andelen · det hela"))}\n        ${_l("Andelen",k(`andelen = ${u("delen","det hela")}`))}\n        ${_l("Det hela",k(`det hela = ${u("delen","andelen")}`))}\n        ${_l("Promille och ppm",k("1 ‰ = 0,001")+" och "+k("1 ppm = 0,000001"))}\n        ${_l("Förändringsfaktor","Ökning p %: 1 + p/100. Minskning p %: 1 − p/100")}\n        ${_l("Nytt värde",k("nytt = gammalt · förändringsfaktor"))}\n        ${_l("Upprepade förändringar",k("nytt = gammalt · <i>a</i><sub>1</sub> · <i>a</i><sub>2</sub>")+", och "+k("gammalt · <i>a</i><sup><i>n</i></sup>")+" för samma förändring n gånger")}\n        ${_l("Index och KPI",k(`${u("pris år 2","pris år 1")} = ${u("KPI år 2","KPI år 1")}`))}\n      </tbody></table>\n    </section>\n    <section class="card">\n      <h2>3.2 Privatekonomi</h2>\n      <table class="ftable"><tbody>\n        ${_l("Ränta på ränta",k("<i>K</i> · (1 + <i>r</i>)<sup><i>n</i></sup>"))}\n        ${_l("Ränta totalt","Slutbelopp minus startbelopp")}\n        ${_l("Förändring per år",k(`<i>x</i> = (${u("slut","start")})<sup>1/<i>n</i></sup>`)+", på räknaren ^(1/n)")}\n        ${_l("Ränta på lån",k("ränta = skuld · räntesats"))}\n        ${_l("Månadsränta",k(`${u("årsränta",12)}`))}\n        ${_l("Rak amortering",k(`amortering = ${u("lånebelopp","antal betalningar")}`)+", lika stor varje gång")}\n        ${_l("Kalkylprogram","=B2*1,03 i B3, kopiera sedan nedåt")}\n      </tbody></table>\n    </section>\n  </div>\n  <section class="card">\n    <h2>Vanliga misstag</h2>\n    <ul class="mistakes">\n      <li><b>Procent och procentenheter blandas ihop.</b> Från 2 % till 3 % är 1 procentenhet men 50 %.</li>\n      <li><b>+20 % och −20 % tar ut varandra.</b> Nej: ${k("1,2 · 0,8 = 0,96")}, alltså en minskning med 4 %.</li>\n      <li><b>Procenten dras av för att få tillbaka ursprungsvärdet.</b> Dela med förändringsfaktorn i stället: ${k(`${u(500,"1,25")} = 400`)}.</li>\n      <li><b>Förändringsfaktorn 0,06 i stället för 1,06.</b> Faktorn är hela det nya värdet, 100 % + 6 %.</li>\n      <li><b>Procenten läggs ihop.</b> 5 % per år i 6 år är ${k("1,05<sup>6</sup> ≈ 1,34")}, alltså 34 % och inte 30 %.</li>\n      <li><b>Promille delas med 100.</b> Promille är tusendelar: 4 ‰ = 0,004.</li>\n      <li><b>Skillnaden mellan indextal tolkas som procent.</b> Räkna med kvoten mellan indextalen.</li>\n      <li><b>Årsräntan används per månad.</b> Dela årsräntan med 12.</li>\n      <li><b>Räntan räknas på hela lånet.</b> Den räknas på den skuld som är kvar.</li>\n    </ul>\n  </section>`,Object.assign(Ss,{k5felkalla:()=>`\n    <p>I en statistisk undersökning vill man veta något om en hel grupp, <b>populationen</b>. Oftast går det inte att fråga alla. Då väljer man ut ett <b>urval</b> och drar slutsatser om hela populationen utifrån det.</p>\n    ${Es("population → urval → resultat → slutsats om populationen")}\n    <div class="fig">${function(){const e=[2,10,13,19,29,31,40,46,50,57];let t='<svg viewBox="0 0 360 200" role="img" aria-label="En population med ett slumpmässigt urval markerat">';t+='<rect class="tri-line" x="12" y="22" width="330" height="138" rx="12"/>'+E([14,10],"Population: alla i gruppen","lbl small","start");for(let n=0;n<5;n++)for(let a=0;a<12;a++){const r=12*n+a,i=30+26*a,s=42+24*n;e.includes(r)&&(t+=`<circle class="arc" cx="${i}" cy="${s}" r="8.5"/>`),t+=`<circle class="pt" cx="${i}" cy="${s}" r="4"/>`}return t+='<circle class="arc" cx="22" cy="184" r="8.5"/><circle class="pt" cx="22" cy="184" r="4"/>'+E([38,184],"Urval: slumpvis utvalda","lbl small","start"),t+"</svg>"}()}</div>\n    <p class="caption">Ett slumpmässigt urval: alla i populationen har samma chans att komma med. Då blir urvalet oftast <b>representativt</b>, alltså likt populationen.</p>\n    <ul class="terms">\n      <li><b>Totalundersökning:</b> alla i populationen tillfrågas.</li>\n      <li><b>Bortfall:</b> de i urvalet som inte svarar.</li>\n    </ul>\n    <h3>Felkällor</h3>\n    <ul class="terms">\n      <li><b>Skevt urval:</b> urvalet liknar inte populationen. Den som frågar personer på ett gym om träningsvanor får för höga värden.</li>\n      <li><b>Bortfall:</b> många svarar inte. De som svarar kan tycka annorlunda än de som låter bli.</li>\n      <li><b>Ledande frågor:</b> frågan styr mot ett visst svar, till exempel ”Visst håller du med om att …?”</li>\n      <li><b>För litet urval:</b> med få personer får slumpen stort inflytande.</li>\n      <li><b>Mätfel:</b> mätningen blir fel, till exempel en våg som visar fel eller svar som bygger på gissningar.</li>\n    </ul>\n    ${Ts("Exempel","<p>En tidning vill veta vad svenskarna tycker om jakt och lägger ut en enkät på en webbplats för jägare. Den får 4 000 svar.</p><p>Många s
