NTS=[{id:"likformighet",sec:"6.1",part:"Trigonometri",title:"Likformiga trianglar",gens:[gLikPar,gLikPar,gLikSkugga]},{id:"trigsidor",sec:"6.1",part:"Trigonometri",title:"Sinus, cosinus och tangens",gens:[gTrigRatioMC,gTrigSide,gTrigSide,gTrigSide],examGens:[gTrigSide]},{id:"vinklar",sec:"6.1",part:"Trigonometri",title:"Bestämma vinklar",gens:[gTrigAngle]},{id:"koordinat",sec:"6.1",part:"Trigonometri",title:"Sträckor och vinklar i koordinatsystem",gens:[gCoordAngle,gCoordDist,gLineAngle]},{id:"trigtext",sec:"6.1",part:"Trigonometri",title:"Problemlösning med trigonometri",gens:[gTrigText]},{id:"skalar",sec:"6.2",part:"Vektorer",title:"Vektorer och skalärer",gens:[gVecScalarMC,gVecScalarMC,gVecRead]},{id:"vekgrafisk",sec:"6.2",part:"Vektorer",title:"Addition, subtraktion och multiplikation",gens:[gVecGraph]},{id:"vekkoord",sec:"6.2",part:"Vektorer",title:"Vektorer i koordinatform",gens:[gVecCoordOps,gVecAB]},{id:"veklangd",sec:"6.2",part:"Vektorer",title:"Längden av en vektor",gens:[gVecLen,gVecLen,gVecLenText]}];"undefined"!=typeof module&&module.exports&&(module.exports={MOMENTS:MOMENTS,checkAnswer:checkAnswer,parseNum:parseNum,fmt:fmt,gTrigSide:gTrigSide,gTrigAngle:gTrigAngle,gLikPar:gLikPar,gLikSkugga:gLikSkugga,gTrigRatioMC:gTrigRatioMC,gCoordAngle:gCoordAngle,gCoordDist:gCoordDist,gLineAngle:gLineAngle,gTrigText:gTrigText,tStege:tStege,tRamp:tRamp,tDrake:tDrake,tFyr:tFyr,tFlagga:tFlagga,gVecScalarMC:gVecScalarMC,gVecRead:gVecRead,gVecGraph:gVecGraph,gVecCoordOps:gVecCoordOps,gVecAB:gVecAB,gVecLen:gVecLen,gVecLenText:gVecLenText,triSVG:triSVG,likSVG:likSVG,shadowSVG:shadowSVG,gridSVG:gridSVG});const ex=(t,e)=>`<div class="example"><p class="eyebrow">${t}</p>${e}</div>`,tip=(t,e)=>`<p class="tip"><b>${t}</b> ${e}</p>`,fl=t=>`<div class="formula">${t}</div>`,THEORY={likformighet:()=>`\n    <p>Två trianglar är <b>likformiga</b> om de har samma vinklar. Den ena är då en förstoring eller förminskning av den andra, och alla motsvarande sidor har samma förhållande. Förhållandet kallas <b>skalfaktor</b>.</p>\n    ${fl(m(`${fr("<i>a</i>′","<i>a</i>")} = ${fr("<i>b</i>′","<i>b</i>")} = ${fr("<i>c</i>′","<i>c</i>")} = <i>k</i>`))}\n    <h3>En parallell sida ger likformighet</h3>\n    <p>Om sträckan DE dras parallellt med sidan BC i triangeln ABC bildas en mindre triangel ADE. Den har samma vinklar som ABC och är därför likformig med den. Pilarna i figuren visar att DE och BC är parallella.</p>\n    <div class="fig">${likSVG({t:.5,labels:{AD:"3 cm",DB:"3 cm",DE:"4 cm",BC:"x"},unk:"BC"})}</div>\n    ${ex("Exempel",`<p>AD = 3 cm, DB = 3 cm och DE = 4 cm. Hur lång är BC?</p><p>Hela sidan AB = 3 + 3 = 6 cm. Sedan gäller ${m(`${fr("BC","DE")} = ${fr("AB","AD")}`)}, alltså ${m(`${fr(X,"4")} = ${fr("6","3")}`)}, vilket ger ${m(`${X} = 4 · 2 = 8`)} cm.</p>`)}\n    <h3>Skuggor</h3>\n    <p>Solstrålarna faller in med samma vinkel mot marken. Därför bildar ett föremål och dess skugga en triangel som är likformig med en annan persons eller saks triangel, uppmätt vid samma tidpunkt.</p>\n    ${tip("Vanligt misstag:","att jämföra DB med AD. Jämför alltid hela sidan i den stora triangeln med motsvarande sida i den lilla.")}`,trigsidor:()=>`\n    <p>I en rätvinklig triangel namnger vi sidorna utifrån den vinkel ${V} vi tittar på:</p>\n    <ul class="terms">\n      <li><b>Hypotenusan</b> ligger mittemot den räta vinkeln och är alltid längst.</li>\n      <li><b>Motstående katet</b> ligger mittemot vinkeln ${V}.</li>\n      <li><b>Närliggande katet</b> ligger intill vinkeln ${V} och är inte hypotenusan.</li>\n    </ul>\n    <div class="fig">${triSVG({angle:37,at:"A",vw:480,small:!0,labels:{AB:"hypotenusa",CB:"motstående katet",AC:"närliggande katet"},angleLabel:"v"})}</div>\n    <div class="formula-row">\n      ${fl(m(`sin ${V} = ${fr("motstående","hypotenusa")}`))}\n      ${fl(m(`cos ${V} = ${fr("närliggande","hypotenusa")}`))}\n      ${fl(m(`tan ${V} = ${fr("motstående","närliggande")}`))}\n    </div>\n    <div class="explorer" id="exp-trig">\n      <p class="eyebrow">Testa själv</p>\n      <label class="range-lbl" for="xt-v">Vinkel ${V}: <output id="xt-out">35°</output></label>\n      <input type="range" id="xt-v" min="15" max="75" value="35">\n      <div class="fig" id="xt-fig"></div>\n      <div class="ratios" id="xt-tbl"></div>\n      <p class="note">Hypotenusan är 10 cm. Förhållandena ändras bara när vinkeln ändras, inte när triangeln görs större eller mindre.</p>\n    </div>\n    ${ex("Exempel 1: sidan står i täljaren",`<p>${V} = 35°, närliggande katet 8 cm. Sök motstående katet ${X}.</p><p>${m(`tan 35° = ${fr(X,"8")}`)} ger ${m(`${X} = 8 · tan 35° ≈ 5,6`)} cm.</p>`)}\n    ${ex("Exempel 2: sidan står i nämnaren",`<p>${V} = 40°, motstående katet 6 cm. Sök hypotenusan ${X}.</p><p>${m(`sin 40° = ${fr("6",X)}`)}. Multiplicera med ${X} och dela med sin 40°: ${m(`${X} = ${fr("6","sin 40°")} ≈ 9,3`)} cm.</p>`)}\n    ${tip("Räknaren:","kontrollera att den står i grader (DEG), inte radianer (RAD). Annars blir alla svar fel.")}`,vinklar:()=>`\n    <p>Känner du två sidor kan du räkna ut vinkeln. Välj det förhållande som innehåller de två sidorna. Använd sedan den <b>inversa</b> funktionen på räknaren, ofta <kbd>SHIFT</kbd> eller <kbd>2nd</kbd> följt av <kbd>sin</kbd>, <kbd>cos</kbd> eller <kbd>tan</kbd>.</p>\n    <div class="formula-row">\n      ${fl(m(`tan ${V} = <i>a</i> &nbsp;⇒&nbsp; ${V} = ${inv("tan")}(<i>a</i>)`))}\n      ${fl(m(`sin ${V} = <i>a</i> &nbsp;⇒&nbsp; ${V} = ${inv("sin")}(<i>a</i>)`))}\n      ${fl(m(`cos ${V} = <i>a</i> &nbsp;⇒&nbsp; ${V} = ${inv("cos")}(<i>a</i>)`))}\n    </div>\n    <div class="fig">${triSVG({angle:32,at:"A",labels:{CB:"5 cm",AC:"8 cm"},angleLabel:"v"})}</div>\n    ${ex("Exempel",`<p>Motstående katet är 5 cm och närliggande katet är 8 cm.</p><p>${m(`tan ${V} = ${fr("5","8")} = 0,625`)} ger ${m(`${V} = ${inv("tan")}(0,625) ≈ 32,0°`)}.</p>`)}\n    ${tip("Rimlighetskontroll:","vinklarna i en triangel är tillsammans 180°, så den andra spetsiga vinkeln blir 90° − v. Är motstående katet kortare än närliggande ska v vara mindre än 45°.")}`,koordinat:()=>`\n    <p>Mellan två punkter A och B i ett koordinatsystem kan du alltid rita en rätvinklig triangel. Kateterna är skillnaderna i x-led och y-led:</p>\n    ${fl(m(`Δ${X} = <i>x</i><sub>B</sub> − <i>x</i><sub>A</sub> &nbsp;&nbsp; Δ<i>y</i> = <i>y</i><sub>B</sub> − <i>y</i><sub>A</sub>`))}\n    <div class="fig">${gridSVG({xmin:-1,xmax:7,ymin:-1,ymax:6,scale:30,items:[{t:"seg",x1:1,y1:1,x2:5,y2:1,cls:"seg-dash"},{t:"seg",x1:5,y1:1,x2:5,y2:4,cls:"seg-dash"},{t:"angle",v:[1,1],a:[5,1],b:[5,4],label:"v",r:28},{t:"seg",x1:1,y1:1,x2:5,y2:4},{t:"text",x:3,y:.55,text:"Δx = 4"},{t:"text",x:5.25,y:2.5,text:"Δy = 3",anchor:"start"},{t:"pt",x:1,y:1,label:"A(1, 1)",pos:"nw"},{t:"pt",x:5,y:4,label:"B(5, 4)",pos:"nw"}]})}</div>\n    <h3>Avstånd mellan två punkter</h3>\n    ${fl(m(`<i>d</i> = ${sqrt("(Δ<i>x</i>)² + (Δ<i>y</i>)²")}`))}\n    <h3>Vinkel mot x-axeln</h3>\n    <p>Sett från vinkeln vid A är Δy motstående katet och Δx närliggande katet. Det är samma sak som linjens k-värde.</p>\n    ${fl(m(`tan ${V} = ${fr("Δ<i>y</i>","Δ<i>x</i>")} = <i>k</i>`))}\n    ${ex("Exempel",`<p>A(1, 1) och B(5, 4) ger Δx = 4 och Δy = 3.</p><p>Avståndet: ${m(`<i>d</i> = ${sqrt("4² + 3²")} = ${sqrt("25")} = 5`)} l.e.</p><p>Vinkeln: ${m(`${V} = ${inv("tan")}(${fr("3","4")}) ≈ 36,9°`)}</p>`)}\n    ${tip("Tänk på:","Δx och Δy kan bli negativa, men när du kvadrerar blir de alltid positiva.")}`,trigtext:()=>`\n    <p>I textuppgifter är det figuren som avgör. Arbeta i den här ordningen:</p>\n    <ol class="steps-list">\n      <li>Rita en figur.</li>\n      <li>Markera den räta vinkeln, den kända vinkeln och sidorna du vet.</li>\n      <li>Bestäm vilken sida du söker och välj sin, cos eller tan.</li>\n      <li>Ställ upp en ekvation och lös den.</li>\n      <li>Gör en rimlighetskontroll och svara med enhet.</li>\n    </ol>\n    <div class="fig">${triSVG({angle:72,at:"A",labels:{AB:"4 m",CB:"x"},unk:"CB",angleLabel:"72°"})}</div>\n    ${ex("
