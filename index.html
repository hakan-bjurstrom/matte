var räcker inte. Nästan alla som svarar är jägare, så urvalet är <b>skevt</b>. Resultatet säger inget om vad alla svenskar tycker.</p>")}\n    ${Bs("Vanligt misstag:","att tro att ett stort urval alltid ger ett bra resultat. 4 000 svar från fel grupp är sämre än 1 000 slumpvis utvalda personer.")}`,k5felmarg:()=>`\n    <p>Eftersom man bara frågar ett urval blir resultatet sällan exakt detsamma som i hela populationen. <b>Felmarginalen</b> anger hur mycket resultatet kan skilja sig från det verkliga värdet. Oftast gäller den med 95 % säkerhet.</p>\n    ${Es(k("resultat ± felmarginal"))}\n    ${Ts("Exempel",`<p>Ett parti får 32 % i en opinionsmätning. Felmarginalen är ±2 procentenheter.</p><p>${k("32 − 2 = 30")} och ${k("32 + 2 = 34")}. Partiets verkliga stöd ligger med stor sannolikhet mellan 30 % och 34 %.</p>`)}\n    <p>Felmarginalen anges i <b>procentenheter</b> och läggs till och dras bort direkt. Den blir mindre ju fler som tillfrågas.</p>\n    <h3>Signifikans</h3>\n    <p>Jämför två mätningar genom att rita ut intervallen. Om intervallen <b>överlappar</b> kan skillnaden bero på slumpen. Om de <b>inte överlappar</b> är skillnaden <b>statistiskt säkerställd</b>, eller <b>signifikant</b>.</p>\n    <div class="fig">${Ki([{label:"Mars",p:18,e:2},{label:"April",p:21,e:2}])}</div>\n    <p class="caption">18 % ± 2 och 21 % ± 2. Intervallen 16 % till 20 % och 19 % till 23 % överlappar, så ökningen är inte statistiskt säkerställd.</p>\n    <div class="fig">${Ki([{label:"Mars",p:18,e:2},{label:"April",p:24,e:2}])}</div>\n    <p class="caption">18 % ± 2 och 24 % ± 2. Intervallen 16 % till 20 % och 22 % till 26 % överlappar inte, så ökningen är statistiskt säkerställd.</p>\n    ${Bs("Vanligt misstag:","att tro att varje förändring i en opinionsmätning betyder att stödet verkligen har ändrats. Jämför alltid med felmarginalen.")}`,k5korr:()=>`\n    <p>I ett <b>spridningsdiagram</b> är varje punkt ett par av värden, till exempel en persons längd och vikt. Om punkterna följer en trend finns det ett samband, en <b>korrelation</b>.</p>\n    <div class="fig">${function(){let e='<svg viewBox="0 0 470 168" role="img" aria-label="Tre spridningsdiagram: positiv, ingen och negativ korrelation">';return[["sp",11,"Positiv"],["no",5,"Ingen"],["sn",3,"Negativ"]].forEach((([t,n,a],r)=>{e+=Qi(zi(t,Oi(n)).pts,22+152*r,14,116,a)})),e+"</svg>"}()}</div>\n    <ul class="terms">\n      <li><b>Positiv korrelation:</b> y ökar när x ökar.</li>\n      <li><b>Negativ korrelation:</b> y minskar när x ökar.</li>\n      <li><b>Stark korrelation:</b> punkterna ligger nära en rät linje. <b>Svag korrelation:</b> punkterna är mer utspridda.</li>\n    </ul>\n    <h3>Korrelationskoefficienten</h3>\n    <p>Hur starkt sambandet är beskrivs med korrelationskoefficienten <i>r</i>. Ju närmare −1 eller 1, desto starkare samband. Om <i>r</i> = 1 eller <i>r</i> = −1 ligger alla punkter exakt på en linje.</p>\n    ${Es(k("−1 ≤ <i>r</i> ≤ 1"))}\n    <div class="tbl-wrap"><table class="cmp"><thead><tr><th>r ungefär</th><th>Korrelation</th></tr></thead><tbody>\n      <tr><td>${k("0,9")}</td><td>Stark positiv</td></tr>\n      <tr><td>${k("0,5")}</td><td>Svag positiv</td></tr>\n      <tr><td>${k("0")}</td><td>Ingen</td></tr>\n      <tr><td>${k("−0,5")}</td><td>Svag negativ</td></tr>\n      <tr><td>${k("−0,9")}</td><td>Stark negativ</td></tr>\n    </tbody></table></div>\n    <h3>Korrelation och kausalitet</h3>\n    <p><b>Kausalitet</b> betyder orsakssamband, alltså att det ena orsakar det andra. En korrelation behöver inte betyda det. Ofta finns en <b>gemensam bakomliggande faktor</b> som påverkar båda.</p>\n    ${Ts("Exempel","<p>Glassförsäljningen och antalet drunkningsolyckor har en positiv korrelation. Glass orsakar inte drunkning. Båda ökar när det är varmt, eftersom fler då äter glass och badar. Vädret är den gemensamma bakomliggande faktorn.</p>")}\n    ${Bs("Vanligt misstag:","att tro att korrelation betyder orsak. Ett samband i ett diagram visar inte vad som orsakar vad.")}`,k5klassisk:()=>`\n    <p>Ett <b>slumpförsök</b> är ett försök där resultatet beror på slumpen, till exempel ett tärningskast. De möjliga resultaten kallas <b>utfall</b>. En <b>händelse</b> är ett eller flera utfall, till exempel ”udda tal”.</p>\n    <p>Om alla utfall är lika sannolika gäller den <b>klassiska sannolikhetsdefinitionen</b>:</p>\n    ${Es(k(`<i>P</i>(<i>A</i>) = ${u("antal gynnsamma utfall","antal möjliga utfall")}`))}\n    <p>En sannolikhet ligger alltid mellan 0 och 1. Sannolikheten 0 betyder att händelsen är omöjlig och 1 att den är säker. Svaret kan skrivas i bråkform, decimalform eller procent.</p>\n    ${Ts("Exempel 1: en tärning",`<p>Hur stor är sannolikheten att en tärning visar mer än 4?</p><p>Gynnsamma utfall: 5 och 6. Möjliga utfall: 6.</p><p>${k(`<i>P</i>(mer än 4) = ${u(2,6)} = ${u(1,3)} ≈ 0,33`)}</p>`)}\n    <h3>Två tärningar</h3>\n    <p>Två tärningar ger 6 · 6 = 36 lika sannolika utfall. Tabellen visar summan för varje utfall.</p>\n    <div class="tbl-wrap">${function(){let e='<table class="mini"><tr><th>+</th>';for(let t=1;t<=6;t++)e+=`<th>${t}</th>`;e+="</tr>";for(let t=1;t<=6;t++){e+=`<tr><th>${t}</th>`;for(let n=1;n<=6;n++)e+=`<td>${t+n===7?`<b>${t+n}</b>`:t+n}</td>`;e+="</tr>"}return e+"</table>"}()}</div>\n    ${Ts("Exempel 2: summan 7",`<p>Summan 7 finns i 6 av de 36 rutorna, så ${k(`<i>P</i>(summan 7) = ${u(6,36)} = ${u(1,6)}`)}.</p>`)}\n    <h3>Kortlek</h3>\n    <p>En vanlig kortlek har 52 kort i fyra färger: hjärter och ruter är röda, klöver och spader är svarta. Varje färg har 13 kort: 2 till 10, knekt, dam, kung och ess.</p>\n    ${Bs("Kontrollera svaret:","får du en sannolikhet som är större än 1 har du troligen vänt på bråket. Det är gynnsamma delat med möjliga.")}`,k5relfrek:()=>`\n    <p>Ibland är utfallen inte lika sannolika, till exempel när man kastar ett häftstift. Då kan man inte räkna gynnsamma delat med möjliga. I stället gör man många försök och räknar ut den <b>relativa frekvensen</b>.</p>\n    ${Es(k(`relativ frekvens = ${u("antal gånger händelsen inträffar","antal försök")}`))}\n    <p>Ju fler försök, desto närmare kommer den relativa frekvensen den verkliga sannolikheten. Därför kan den användas som en <b>skattning</b> av sannolikheten.</p>\n    <div class="fig">${function(){const e=Oi(66),t=400,a=e=>(46+.825*e).toFixed(1),r=e=>(180-320*Math.min(e,.5)).toFixed(1);let i='<svg viewBox="0 0 400 214" role="img" aria-label="Relativ frekvens för sexor efter allt fler kast">';for(let e=.1;e<=.51;e+=.1)i+=`<line class="g-line" x1="46" y1="${r(e)}" x2="${a(t)}" y2="${r(e)}"/>`+E([40,+r(e)],n(e,1),"g-num","end");i+=`<line class="g-axis" x1="46" y1="180" x2="${a(t)}" y2="180"/><line class="g-axis" x1="46" y1="180" x2="46" y2="${r(.5)}"/>`;for(let e=0;e<=t;e+=100)i+=`<line class="g-axis" x1="${a(e)}" y1="180" x2="${a(e)}" y2="185"/>`+E([+a(e),195],String(e),"g-num");i+=`<line class="seg-dash" x1="46" y1="${r(1/6)}" x2="${a(t)}" y2="${r(1/6)}"/>`+E([+a(t)+6,+r(1/6)],"1/6","lbl small","start");let s=0,l="";for(let n=1;n<=t;n++)e()<1/6&&s++,n>=3&&(l+=`${3===n?"M":"L"}${a(n)},${r(s/n)}`);return i+=`<path class="fn-main" d="${l}"/>`,i+=E([211,210],"antal kast","lbl small")+E([42,8],"relativ frekvens","lbl small","start"),i+"</svg>"}()}</div>\n    <p class="caption">En tärning kastas 400 gånger. Kurvan visar den relativa frekvensen för sexor efter varje kast. I början hoppar den mycket, sedan närmar den sig ${u(1,6)} ≈ 0,17.</p>\n    ${Ts("Exempel 1",`<p>Ett häftstift kastas 200 gånger och landar med spetsen uppåt 74 gånger.</p><p>${k(`<i>P</i>(spetsen uppåt) ≈ ${u(74,200)} = 0,37`)}</p>`)}\n    <h3>Förväntat antal</h3>\n    ${Es(k("förväntat antal = <i>P</i> · antal försök"))}\n    ${Ts("Exempel 2",`<p>Hur många sexor kan man förvänta sig på 300 kast med en tärning?</p><p>${k(`${u(1,6)} · 300 = 50`)} sexor.</p>`)}\n    ${Bs("Vanligt misstag:",`att tro att slumpen jämnar ut sig. Har ett mynt visat klave fem gånger i rad är sannolikheten för klave i nästa kast fortfarande ${u(1,2)}.`)}`,k5produkt:()=>`\n    <p>Två händelser är <b>oberoende</b> om den ena inte påverkar den andra, till exempel två tärningskast. Då gäller <b>produktregeln</b>:</p>\n    ${Es(k("<i>P</i>(<i>A</i> och <i>B</i>) = <i>P</i>(<i>A</i>) · <i>P</i>(<i>B</i>)"))}\n    <p>Regeln fungerar för fler steg också. Multiplicera sannolikheten för varje steg.</p>\n    ${Ts("Exempel 1: mynt och tärning",`<p>${k(`<i>P</i>(krona och sexa) = ${u(1,2)} · ${u(1,6)} = ${u(1,12)}`)}</p><p>Samma svar får du genom att räkna utfall: mynt och tärning ger 2 · 6 = 12 lika sannolika utfall, och ett av dem är krona och sexa.</p>`)}\n    ${Ts("Exempel 2: tre straffar",`<p>En spelare sätter en straff med sannolikheten 0,8. Hur stor är sannolikheten att hon sätter tre i rad?</p><p>${k("0,8 · 0,8 · 0,8 = 0,8<sup>3</sup> = 0,512")}</p>`)}\n    <h3>Antal kombinationer</h3>\n    <p>Samma tanke ger antalet kombinationer. Med 3 tröjor och 4 par byxor kan du klä dig på ${k("3 · 4 = 12")} olika sätt, eftersom varje tröja kan kombineras med varje par byxor. Det kallas <b>multiplikationsprincipen</b>.</p>\n    ${Bs("Vanligt misstag:","att addera sannolikheterna. När både A och B ska inträffa multiplicerar du.")}`,k5trad:()=>`\n    <p>När ett slumpförsök sker i flera steg kan du rita ett <b>träddiagram</b>. Varje gren får sin sannolikhet, och varje väg genom trädet är ett utfall.</p>\n    ${Es("Längs en väg: <b>multiplicera</b>. &nbsp;Mellan vägar: <b>addera</b>.")}\n    <ol class="steps-list">\n      <li><b>Multiplicera</b> sannolikheterna längs en väg.</li>\n      <li><b>Addera</b> sannolikheterna för alla vägar som ger händelsen.</li>\n      <li>Kontrollera: alla vägar tillsammans ger sannolikheten 1.</li>\n    </ol>\n    <div class="fig">${cs({names:["R","B"],p1:["3/5","2/5"],p2:[["2/4","2/4"],["3/4","1/4"]],leaf:[["RR: 6/20","RB: 6/20"],["BR: 6/20","BB: 2/20"]],hl:[[0,1],[1,0]]})}</div>\n    <p class="caption">En påse med 3 röda (R) och 2 blå (B) kulor. Två kulor dras utan återläggning. De markerade vägarna ger en kula av varje färg.</p>\n    ${Ts("Exempel 1: två röda",`<p>${k(`<i>P</i>(RR) = ${u(3,5)} · ${u(2,4)} = ${u(6,20)} = ${u(3,10)}`)}</p>`)}\n    ${Ts("Exempel 2: en av varje",`<p>Två vägar ger en av varje: RB och BR.</p><p>${k(`<i>P</i> = ${u(3,5)} · ${u(2,4)} + ${u(2,5)} · ${u(3,4)} = ${u(6,20)} + ${u(6,20)} = ${u(12,20)} = ${u(3,5)}`)}</p>`)}\n    <h3>Med eller utan återläggning</h3>\n    <ul class="terms">\n      <li><b>Med återläggning:</b> kulan läggs tillbaka. Sannolikheterna är desamma i båda stegen.</li>\n      <li><b>Utan återläggning:</b> kulan läggs inte tillbaka. I andra steget finns en kula mindre totalt, och en mindre av den färg du drog.</li>\n    </ul>\n    ${Bs("Vanligt misstag:","att glömma att antalet minskar utan återläggning. Efter en röd kula finns det 2 röda kvar av 4, inte 3 av 5.")}`,k5komplement:()=>`\n    <p><b>Komplementhändelsen</b> till A består av alla utfall som inte ingår i A. Vi skriver den ”inte A”. Antingen inträffar A eller så inträffar komplementet, så sannolikheterna blir tillsammans 1.</p>\n    ${Es(k("<i>P</i>(inte <i>A</i>) = 1 − <i>P</i>(<i>A</i>)"))}\n    <div class="fig sm">${'<svg viewBox="0 0 360 80" role="img" aria-label="A och inte A delar på hela sannolikheten 1"><rect class="tri-fill" x="10" y="8" width="102" height="40"/><rect class="tri-line" x="10" y="8" width="340" height="40"/><line class="tri-line" x1="112" y1="8" x2="112" y2="48"/>'+E([61,28],"A: 0,3","lbl small")+E([231,28],"inte A: 0,7","lbl small")+E([180,66],"Tillsammans: 0,3 + 0,7 = 1","lbl small")+"</svg>"}</div>\n    ${Ts("Exempel 1",`<p>Sannolikheten för regn i morgon är 0,3. Då är ${k("<i>P</i>(inte regn) = 1 − 0,3 = 0,7")}.</p>`)}\n    <h3>Minst en</h3>\n    <p>Frågor med <b>minst en</b> löser du nästan alltid med komplementet. Motsatsen till ”minst en” är ”ingen”.</p>\n    ${Es(k("<i>P</i>(minst en) = 1 − <i>P</i>(ingen)"))}\n    ${Ts("Exempel 2: minst en sexa på tre kast",`<p>${k(`<i>P</i>(ingen sexa) = ${u(5,6)} · ${u(5,6)} · ${u(5,6)} = ${u(125,21
